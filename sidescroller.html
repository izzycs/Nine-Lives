<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NINE LIVES</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; background: #000; outline: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<script>
'use strict';
/* ==========================================================================
   NINE LIVES — a tiny side-scrolling horror chase.
   Survive from 3:00 AM until dawn while something huge hunts you.

   Sections:
     1. CONFIG            all tuning values
     2. UTIL              math helpers
     3. CANVAS            the single game canvas + letterboxing
     4. INPUT             keyboard state, edge-triggered "hits"
     5. AUDIO             Web Audio synth: drone, wind, growl, heartbeat, sfx
     6. SPRITE GENERATION procedural pixel art, pre-rendered once at startup
     7. ENTITIES          cat, dog, obstacle / decor / particle pools
     8. LEVEL GENERATION  procedural obstacle + scenery spawning
     9. GAMEPLAY          cat / obstacle / dog / jump-scare / QTE logic
    10. RENDERING         world, darkness + lights, HUD, overlays
    11. GAME STATES       title, intro, play, caught, win
    12. MAIN LOOP         fixed 60 Hz timestep
   ========================================================================== */

// ==========================================================================
// 1. CONFIG — tweak the game here
// ==========================================================================
const CONFIG = {
  W: 480, H: 270,             // world units on screen (the camera view)
  RES: 2,                     // backing-store scale: the canvas is 960x540 pixels
  GROUND_Y: 226,              // screen y of the ground line
  CAMERA_X: 200,              // cat's screen x while running
  runLength: 180,             // real seconds from 3:00 AM to 6:00 AM
  dawnStart: 148,             // seconds in when the sky starts to lighten

  cat: {
    trotSpeed: 70,            // no key held (px/s)
    runSpeed: 112,            // Right / D
    sprintSpeed: 150,         // Shift
    brakeSpeed: 36,           // Left / A
    accel: 360, decel: 300,   // px/s²
    jumpVel: 265,             // px/s upward
    gravity: 900,             // px/s²
    fastFall: 700,            // extra gravity when holding Down in the air
    slideTime: 0.55, slideFriction: 30, slideMinSpeed: 72,
    staminaDrain: 0.34,       // per second of sprinting (1 = full bar)
    staminaRegen: 0.13,       // per second
    staminaRegenDelay: 0.6,
    staminaMinToSprint: 0.25, // after running dry, refill this much first
    boostSpeed: 45, boostTime: 0.9,       // perfect-vault speed boost
    stumbleTime: 0.45, stumbleSpeed: 26,  // after hitting a hazard
  },

  dog: {
    baseSpeed: 98,            // px/s at 3:00 AM
    accel: 0.14,              // px/s gained per second survived
    maxSpeed: 150,
    catchupStart: 150,        // past this gap the dog runs faster (rubber band)
    catchupBonus: 0.7,
    debtRate: 150,            // how fast gained ground is applied (px/s)
    surgeRate: 220,           // how fast lost ground is applied (px/s)
    growScale: 0.35,          // dog sprite grows by this much at max danger
  },

  gap: {
    start: 140, max: 230,
    dangerRange: 130,         // gap below this starts the red vignette / heartbeat ramp
    lungeAt: 4,               // gap at which the dog lunges (QTE)
    safeHeight: 44,           // cat is out of reach above this height
    // ground lost (-) or gained (+) by events:
    puddle: 22, gnome: 34, sprinkler: 24, branch: 34, carBonk: 30,
    fenceScramble: 24, fencePerfect: 26, carSlide: 40,
  },

  fence: { height: 26, idealTTF: 0.294, perfectEasy: 0.09, perfectHard: 0.045 },
  tree:  { top: 96, safe: 46, clawStep: 9, slip: 14, branchBreak: 3.2, leapVX: 150, leapVY: 130, dogConfuse: 1.5 },
  wall:  { height: 96, step: 24, windowEasy: 0.6, windowHard: 0.32, flyTime: 0.2, slipDist: 26, slipTime: 0.25, safe: 44, dogConfuse: 1.2 },
  trash: { window: 70, stun: 1.3 },
  sprinkler: { on: 1.1, off: 1.0, reach: 30 },

  qte: {
    keysEasy: 3, keysHard: 4,
    timeEasy: 2.6, timeHard: 1.6, perUseCut: 0.08, minTime: 1.2,
    slowmo: 0.12,             // world time scale during the struggle
    restoreGap: 64, stun: 1.2,
  },

  scare: {
    firstMin: 45, firstMax: 75, secondMin: 110, secondMax: 150, secondChance: 0.65,
    fadeTime: 0.8, triggerDist: 72, slowmo: 0.5, dogSpeed: 150, emerge: 0.15,
  },

  spawn: {
    firstAt: 900,                       // world x of the first obstacle
    spacingEasy: [240, 340], spacingHard: [120, 190],
    stopBeforeEnd: 8,                   // no new obstacles in the last N seconds
    hedgeChance: 0.18,                  // harmless hedges (keeps you guessing)
    weights: { fence: 1.2, car: 1.0, tree: 0.7, alley: 0.6, trash: 0.9, puddle: 1.0, gnome: 1.0, sprinkler: 0.8, branch: 1.0 },
    opening: ['fence', 'puddle', 'car', 'trash', 'branch', 'tree'],
  },

  // two-player mode: the dog's controls
  dogPlayer: {
    idleFactor: 0.8,          // dog speed with no key held (× normal chase speed)
    holdBackFactor: 0.5,      // holding ←
    chargeBonus: 38,          // px/s added while charging (Right Shift or /)
    chargeDrain: 0.4, chargeRegen: 0.14,
    pounce: 46,               // ground closed by a pounce (↑)
    pounceCooldown: 3.5,
  },

  particlesMax: 150,
  lightRadius: 80,
};

// ==========================================================================
// 2. UTIL
// ==========================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
function fmtTime(s) { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function fmtClock(t) {
  const mins = Math.min(180, Math.floor(t * 180 / CONFIG.runLength));
  const h = 3 + Math.floor(mins / 60), m = mins % 60;
  return h + ':' + (m < 10 ? '0' : '') + m + ' AM';
}

// ==========================================================================
// 3. CANVAS
// ==========================================================================
const W = CONFIG.W, H = CONFIG.H, GY = CONFIG.GROUND_Y, RES = CONFIG.RES;
// The game thinks in a 480x270 world; the canvas backing store is RES times that
// (960x540) so art can be smooth and shaded. Never tied to devicePixelRatio.
const canvas = document.getElementById('game');
canvas.width = W * RES; canvas.height = H * RES;
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = true;

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// Offscreen canvas in world units: backing store is RES× larger, context pre-scaled.
// c.lw / c.lh hold the logical size used when drawing it.
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * RES); c.height = Math.ceil(h * RES); c.lw = w; c.lh = h;
  c.getContext('2d').setTransform(RES, 0, 0, RES, 0, 0);
  return c;
}

// ==========================================================================
// 4. INPUT
//    Solo: the cat answers to arrows AND WASD. Two players: the cat is WASD +
//    Space + Left Shift, the dog is the arrow keys + Right Shift (or /).
// ==========================================================================
const A = { RIGHT: 0, LEFT: 1, UP: 2, DOWN: 3, SPRINT: 4, PAUSE: 5, MUTE: 6, FPS: 7, RESTART: 8, CONFIRM: 9, ONE: 10, TWO: 11 };
const KEYMAP = {
  ArrowRight: 0, KeyD: 0, ArrowLeft: 1, KeyA: 1, ArrowUp: 2, KeyW: 2, Space: 2,
  ArrowDown: 3, KeyS: 3, ShiftLeft: 4, ShiftRight: 4, Slash: 4, KeyP: 5, Escape: 5,
  KeyM: 6, KeyF: 7, KeyR: 8, Enter: 9, Digit1: 10, Digit2: 11, Numpad1: 10, Numpad2: 11,
};
const P1KEYS = { KeyD: 0, KeyA: 1, KeyW: 2, Space: 2, KeyS: 3, ShiftLeft: 4 };
const P2KEYS = { ArrowRight: 0, ArrowLeft: 1, ArrowUp: 2, ArrowDown: 3, ShiftRight: 4, Slash: 4 };
const ARROW_GLYPH = ['→', '←', '↑', '↓'];
const WASD_GLYPH = ['D', 'A', 'W', 'S'];
const Input = {
  held: new Uint8Array(12), hit: new Uint8Array(12),       // everything (solo + menus)
  p1held: new Uint8Array(5), p1hit: new Uint8Array(5),     // WASD side
  p2held: new Uint8Array(5), p2hit: new Uint8Array(5),     // arrow side
  any: false, space: false,
  clearHits() { this.hit.fill(0); this.p1hit.fill(0); this.p2hit.fill(0); this.any = false; this.space = false; },
  releaseAll() { this.held.fill(0); this.p1held.fill(0); this.p2held.fill(0); },
};
// the cat's and the dog's key arrays for the current mode (set every update)
let CH = Input.held, CT = Input.hit, DH = Input.p2held, DT = Input.p2hit;
function setControlMaps() {
  if (G.twoP) { CH = Input.p1held; CT = Input.p1hit; } else { CH = Input.held; CT = Input.hit; }
  DH = Input.p2held; DT = Input.p2hit;
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;     // leave browser shortcuts alone
  const a = KEYMAP[e.code];
  if ((a !== undefined && a <= A.DOWN) || e.code === 'Slash') e.preventDefault();
  Sound.unlock();                                       // Chrome autoplay: start audio on first key
  if (e.repeat) return;
  if (a !== undefined) { Input.held[a] = 1; Input.hit[a] = 1; }
  const p1 = P1KEYS[e.code], p2 = P2KEYS[e.code];
  if (p1 !== undefined) { Input.p1held[p1] = 1; Input.p1hit[p1] = 1; }
  if (p2 !== undefined) { Input.p2held[p2] = 1; Input.p2hit[p2] = 1; }
  Input.any = true;
  if (e.code === 'Space') Input.space = true;
});
window.addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (a !== undefined) Input.held[a] = 0;
  const p1 = P1KEYS[e.code], p2 = P2KEYS[e.code];
  if (p1 !== undefined) Input.p1held[p1] = 0;
  if (p2 !== undefined) Input.p2held[p2] = 0;
});
window.addEventListener('blur', () => {
  Input.releaseAll();
  if (G.state === 'play' || G.state === 'intro') setPaused(true);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G.state === 'play' || G.state === 'intro') setPaused(true);
    Sound.suspend();
  } else {
    if (!G.paused) Sound.resume();
    lastTime = performance.now();
  }
});

// ==========================================================================
// 5. AUDIO — everything synthesized with the Web Audio API
// ==========================================================================
const Sound = (() => {
  let ac = null, master = null, sfx = null, verb = null, noiseBuf = null, curve = null;
  let growlGain = null, windGain = null;
  const WIND_BASE = 0.035;
  let muted = false;

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); build(); } catch (e) { ac = null; return; }
    }
    if (ac.state === 'suspended' && !G.paused && !document.hidden) ac.resume().catch(() => {});
  }
  const ok = () => ac !== null && ac.state === 'running';

  function loopNoise() {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    s.start(0, Math.random() * 1.9); return s;
  }

  function build() {
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5;
    comp.attack.value = 0.004; comp.release.value = 0.2;
    master.connect(comp); comp.connect(ac.destination);
    sfx = ac.createGain(); sfx.connect(master);

    // cheap "reverb": two delay taps with a damped feedback loop
    verb = ac.createGain();
    const d1 = ac.createDelay(1), d2 = ac.createDelay(1);
    d1.delayTime.value = 0.21; d2.delayTime.value = 0.37;
    const fb = ac.createGain(); fb.gain.value = 0.45;
    const damp = ac.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 1400;
    const wet = ac.createGain(); wet.gain.value = 0.4;
    verb.connect(d1); verb.connect(d2); d1.connect(damp); d2.connect(damp);
    damp.connect(fb); fb.connect(d1); damp.connect(wet); wet.connect(master);

    const len = Math.floor(ac.sampleRate * 2);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    curve = new Float32Array(512);
    for (let i = 0; i < 512; i++) { const x = i / 255.5 - 1; curve[i] = Math.tanh(x * 3); }

    // low ambient drone (a sour tritone)
    const dF = ac.createBiquadFilter(); dF.type = 'lowpass'; dF.frequency.value = 160; dF.Q.value = 2;
    const dG = ac.createGain(); dG.gain.value = 0.055;
    const freqs = [41.2, 41.6, 58.3];
    for (let i = 0; i < 3; i++) {
      const o = ac.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle';
      o.frequency.value = freqs[i]; o.connect(dF); o.start();
    }
    const dl = ac.createOscillator(); dl.frequency.value = 0.05;
    const dlg = ac.createGain(); dlg.gain.value = 70; dl.connect(dlg); dlg.connect(dF.frequency); dl.start();
    dF.connect(dG); dG.connect(master);

    // wind: band-passed noise with slow wandering
    const wS = loopNoise();
    const wF = ac.createBiquadFilter(); wF.type = 'bandpass'; wF.frequency.value = 420; wF.Q.value = 0.6;
    windGain = ac.createGain(); windGain.gain.value = WIND_BASE;
    const wl = ac.createOscillator(); wl.frequency.value = 0.09;
    const wlg = ac.createGain(); wlg.gain.value = 0.02; wl.connect(wlg); wlg.connect(windGain.gain); wl.start();
    const wl2 = ac.createOscillator(); wl2.frequency.value = 0.037;
    const wl2g = ac.createGain(); wl2g.gain.value = 200; wl2.connect(wl2g); wl2g.connect(wF.frequency); wl2.start();
    wS.connect(wF); wF.connect(windGain); windGain.connect(master);

    // growl: distorted saw + filtered noise, amplitude-modulated into a rumble
    const gS = loopNoise();
    const gF = ac.createBiquadFilter(); gF.type = 'lowpass'; gF.frequency.value = 260; gF.Q.value = 4;
    const gO = ac.createOscillator(); gO.type = 'sawtooth'; gO.frequency.value = 48;
    const gW = ac.createOscillator(); gW.frequency.value = 0.6;
    const gWg = ac.createGain(); gWg.gain.value = 7; gW.connect(gWg); gWg.connect(gO.frequency); gW.start();
    const gSh = ac.createWaveShaper(); gSh.curve = curve;
    const gOF = ac.createBiquadFilter(); gOF.type = 'lowpass'; gOF.frequency.value = 380;
    const gOG = ac.createGain(); gOG.gain.value = 0.5;
    gO.connect(gSh); gSh.connect(gOF); gOF.connect(gOG);
    const am = ac.createGain(); am.gain.value = 0.55;
    const amO = ac.createOscillator(); amO.frequency.value = 23;
    const amG = ac.createGain(); amG.gain.value = 0.45; amO.connect(amG); amG.connect(am.gain); amO.start();
    gS.connect(gF); gF.connect(am); gOG.connect(am);
    growlGain = ac.createGain(); growlGain.gain.value = 0;
    am.connect(growlGain); growlGain.connect(master);
    gO.start();
  }

  // --- building blocks ---------------------------------------------------
  function envGain(t, a, peak, dur, dest) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01));
    g.connect(dest || sfx);
    return g;
  }
  function osc(type, f0, f1, t, dur, vol, a, dest) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = envGain(t, a || 0.005, vol, dur, dest);
    o.connect(g); o.start(t); o.stop(t + dur + 0.05);
    return g;
  }
  function nz(t, dur, vol, type, f0, f1, q, a, dest) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    f.Q.value = q || 0.8;
    const g = envGain(t, a || 0.004, vol, dur, dest);
    s.connect(f); f.connect(g); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    return g;
  }
  function barkAt(t, v) {
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.16);
    const sh = ac.createWaveShaper(); sh.curve = curve;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1700;
    const g = envGain(t, 0.006, v * 0.5, 0.2); g.connect(verb);
    o.connect(sh); sh.connect(f); f.connect(g); o.start(t); o.stop(t + 0.25);
    nz(t, 0.16, v * 0.7, 'bandpass', 1300, 600, 1.6, 0.004).connect(verb);
  }

  // --- public sound effects -----------------------------------------------
  return {
    unlock,
    suspend() { if (ac && ac.state === 'running') ac.suspend().catch(() => {}); },
    resume() { if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); },
    setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.85, ac.currentTime, 0.02); },
    setGrowl(level) { if (growlGain) growlGain.gain.setTargetAtTime(level * 0.32, ac.currentTime, 0.12); },
    gust() {
      if (!ok()) return; const t = ac.currentTime;
      windGain.gain.setTargetAtTime(0.1, t, 0.7); windGain.gain.setTargetAtTime(WIND_BASE, t + 2.2, 1.4);
      nz(t, 2.8, 0.05, 'bandpass', 700, 300, 0.7, 1.0);
    },
    heart(v) {
      if (!ok()) return; const t = ac.currentTime + 0.01;
      osc('sine', 64, 38, t, 0.16, v, 0.008);
      nz(t, 0.06, v * 0.25, 'lowpass', 180, 180, 0.7);
      osc('sine', 58, 34, t + 0.15, 0.14, v * 0.7, 0.008);
    },
    paw(v) {
      if (!ok() || v < 0.01) return; const t = ac.currentTime;
      osc('sine', 85, 40, t, 0.11, v, 0.004);
      nz(t, 0.05, v * 0.6, 'lowpass', 500, 200, 0.7);
    },
    bark(v, twice) {
      if (!ok()) return; const t = ac.currentTime; v = v || 0.5;
      barkAt(t, v); if (twice) barkAt(t + 0.24, v * 0.9);
    },
    snarl(v) {
      if (!ok()) return; const t = ac.currentTime; v = v || 0.5;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(80, t); o.frequency.linearRampToValueAtTime(62, t + 0.8);
      const sh = ac.createWaveShaper(); sh.curve = curve;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650;
      const g = envGain(t, 0.05, v * 0.6, 0.85);
      o.connect(sh); sh.connect(f); f.connect(g); o.start(t); o.stop(t + 0.9);
      nz(t, 0.75, v * 0.4, 'lowpass', 420, 250, 3, 0.04);
    },
    hiss(v) { if (!ok()) return; const t = ac.currentTime; v = v || 0.35;
      nz(t, 0.6, v, 'highpass', 2500, 4500, 0.6, 0.03); nz(t, 0.5, v * 0.5, 'bandpass', 6000, 3500, 2, 0.02); },
    sting() {
      if (!ok()) return; const t = ac.currentTime;
      const fs = [233.1, 246.9, 349.2, 370, 493.9, 698.5];
      for (let i = 0; i < fs.length; i++) osc(i % 2 ? 'square' : 'sawtooth', fs[i], fs[i] * 0.985, t, 1.6, 0.05, 0.003).connect(verb);
      nz(t, 0.45, 0.4, 'highpass', 900, 400, 0.5, 0.002);
      osc('sine', 95, 30, t, 0.9, 0.7, 0.004);
    },
    click(v) { if (!ok()) return; nz(ac.currentTime, 0.02, v || 0.2, 'highpass', 3500, 3500, 0.7, 0.001); },
    chimes() {
      if (!ok()) return; const t = ac.currentTime; const notes = [1568, 1760, 2093, 2349, 2637, 3136];
      const n = randi(4, 6); let d = 0;
      for (let i = 0; i < n; i++) { d += rand(0.1, 0.35); const f = notes[randi(0, 5)];
        osc('sine', f, f, t + d, 2.4, 0.03, 0.002).connect(verb); }
    },
    howl() {
      if (!ok()) return; const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(260, t); o.frequency.linearRampToValueAtTime(470, t + 1.1);
      o.frequency.linearRampToValueAtTime(440, t + 2.3); o.frequency.linearRampToValueAtTime(300, t + 3.3);
      const v = ac.createOscillator(); v.frequency.value = 5.5; const vg = ac.createGain(); vg.gain.value = 10;
      v.connect(vg); vg.connect(o.frequency);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1000;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03, t + 0.7);
      g.gain.linearRampToValueAtTime(0.026, t + 2.4); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);
      o.connect(f); f.connect(g); g.connect(verb); g.connect(sfx);
      o.start(t); v.start(t); o.stop(t + 3.6); v.stop(t + 3.6);
    },
    whimper() { if (!ok()) return; const t = ac.currentTime;
      for (let i = 0; i < 3; i++) osc('triangle', 1200 - i * 80, 700 - i * 50, t + i * 0.32, 0.26, 0.1, 0.02); },
    yelp() { if (!ok()) return; const t = ac.currentTime;
      osc('triangle', 900, 1400, t, 0.12, 0.14, 0.005); osc('triangle', 1300, 700, t + 0.1, 0.22, 0.12, 0.005); },
    clang() {
      if (!ok()) return; const t = ac.currentTime; const fs = [540, 812, 1290, 1950];

function pickType() {
  const S = CONFIG.spawn;
  if (G.openingIdx < S.opening.length) return S.opening[G.openingIdx++];
  if (!G.lastWasHedge && Math.random() < S.hedgeChance) return 'hedge';
  let total = 0;
  for (const k in S.weights) if (k !== G.lastType) total += S.weights[k];
  let r = Math.random() * total;
  for (const k in S.weights) { if (k === G.lastType) continue; r -= S.weights[k]; if (r <= 0) return k; }
  return 'puddle';
}

function spawnSegment(type, x) {
  const o = getObs(); if (!o) return 80;
  o.active = true; o.type = type; o.x = x; o.t = 0; o.state = 0; o.done = 0; o.flag = 0; o.flag2 = 0; o.dogDone = 0;
  o.phase = 0; o.layer = 0; o.w = 20; o.plats[0].on = false; o.plats[1].on = false;
  switch (type) {
    case 'puddle': o.w = 44; return 44;
    case 'gnome': o.w = 12; return 12;
    case 'sprinkler': o.x = x + CONFIG.sprinkler.reach; o.w = 4; o.phase = Math.random() * 2; return CONFIG.sprinkler.reach * 2;
    case 'branch': o.w = 72; o.layer = 1; return 72;
    case 'fence': o.w = 16; return 20;
    case 'car': o.w = 88; o.layer = 1; setPlat(o, 0, x + 2, x + 88, 22); setPlat(o, 1, x + 30, x + 60, 33); return 92;
    case 'trash': o.w = 12; return 14;
    case 'tree': o.w = 200; setPlat(o, 0, x + 62, x + 198, 60); return 210;
    case 'alley': o.x = x + 76; o.w = 112; o.layer = 1; setPlat(o, 0, o.x, o.x + 112, CONFIG.wall.height); return 76 + 112;
    case 'hedge': o.w = 68; return 68;
    case 'home': o.w = 170; return 170;
  }
  return 40;
}

function updateSpawner() {
  const limit = G.camX + W + 40;
  if (G.t > CONFIG.runLength - CONFIG.spawn.stopBeforeEnd) return;
  while (!G.spawnPause && !G.spawnHold && G.nextSpawnX < limit) {
    const type = pickType();
    const len = spawnSegment(type, G.nextSpawnX);
    const S = CONFIG.spawn, d = G.diff;
    let sp = rand(lerp(S.spacingEasy[0], S.spacingHard[0], d), lerp(S.spacingEasy[1], S.spacingHard[1], d));
    if (type === 'hedge') { G.lastWasHedge = true; sp *= 0.5; }
    else { G.lastWasHedge = false; G.lastType = type; }
    G.nextSpawnX += len + sp;
  }
}

function updateDecorSpawns() {
  const cx = G.camX;
  while (G.nextLampX < cx + W + 40) {
    for (let i = 0; i < LAMPS.length; i++) { const l = LAMPS[i]; if (!l.active) {

      l.mode = G.nextLampX < 400 ? 0 : (r < 0.55 ? 0 : r < 0.85 ? 1 : 2); l.i = l.mode === 2 ? 0 : 1; l.t = 0; l.next = rand(0.1, 1); break; } }

  for (let i = 0; i < LAMPS.length; i++) if (LAMPS[i].active && LAMPS[i].x < cx - 80) LAMPS[i].active = false;
  const hp = cx * 0.8;

}

function moveCat(dt) {
  const C = CONFIG.cat;
  const grounded = cat.state !== 'air' && cat.state !== 'twist';
  let target; cat.sprinting = false;
  if (cat.state === 'stumble') { target = C.stumbleSpeed; cat.stumbleT -= dt; if (cat.stumbleT <= 0) cat.state = 'run'; }
  else if (cat.auto) target = C.runSpeed;
  else {
    const right = CH[A.RIGHT], left = CH[A.LEFT];
    if (CH[A.SPRINT] && !cat.exhausted && cat.stamina > 0 && !left) { target = C.sprintSpeed; cat.sprinting = true; }
    else if (right && !left) target = C.runSpeed;
    else if (left && !right) target = C.brakeSpeed;
    else target = C.trotSpeed;
  }
  if (cat.boostT > 0) { cat.boostT -= dt; target += C.boostSpeed; }

    cat.vx += clamp(dv, -lim, lim);
  }
  cat.x += cat.vx * dt;

  if (grounded) {
    const fl = floorAt(cat.x, cat.h, true);
    if (fl > cat.h) cat.h = fl;
    else if (fl < cat.h - 0.5) { cat.state = 'air'; cat.vy = 0; }
  }
  if (cat.state === 'air' || cat.state === 'twist') {
    let g = C.gravity; if (CH[A.DOWN] && cat.vy < 0 && !cat.auto) g += C.fastFall;
    cat.vy -= g * dt; cat.h += cat.vy * dt;
    if (cat.state === 'twist') cat.twistT += dt;
    if (cat.vy <= 0) { const fl = floorAt(cat.x, cat.h, false); if (cat.h <= fl) { cat.h = fl; cat.vy = 0; land(); } }
  }

  if (cat.state === 'run' && !cat.auto) {

    else if (CT[A.DOWN]) startSlide();

    else if (cat.slideT <= 0 && !cat.underCar) cat.state = 'run';
    if ((G.frame & 3) === 0) emit(cat.x - 6, GY - cat.h, rand(-40, -10), rand(-20, -5), 0.3, '#2c2a33', 1, 40);
  }

  }
}

function treetopUpdate(dt) {

}
function startWall(o) {

  cat.x = o.x - 10; cat.vx = 0; cat.vy = 0; Sound.claw();
}
function wallUpdate(dt) {
  const Wc = CONFIG.wall, o = cat.wall;
  const xl = o.x - 30 + 10, xr = o.x - 10;
  const win = lerp(Wc.windowEasy, Wc.windowHard, G.diff);

function startScramble(o) {

}

}

function updateCat(dt) {
  const C = CONFIG.cat;
  cat.t += dt;
  if (cat.upBuf > 0) cat.upBuf -= dt;
  if (CT[A.UP]) cat.upBuf = 0.12;
  switch (cat.state) {
    case 'run': case 'slide': case 'stumble': case 'air': case 'twist': moveCat(dt); break;
    case 'climb': climbUpdate(dt); break;
    case 'treetop': treetopUpdate(dt); break;
    case 'wall': wallUpdate(dt); break;
    case 'scramble': scrambleUpdate(dt); break;
  }
  // stamina
  if (cat.sprinting && cat.vx > C.runSpeed) {
    cat.stamina -= C.staminaDrain * dt; cat.staminaDelay = C.staminaRegenDelay;
    if (cat.stamina <= 0) { cat.stamina = 0; cat.exhausted = true; }
  } else if (cat.staminaDelay > 0) cat.staminaDelay -= dt;
  else {
    cat.stamina = Math.min(1, cat.stamina + C.staminaRegen * dt);
    if (cat.exhausted && cat.stamina >= C.staminaMinToSprint) cat.exhausted = false;
  }
}

// ---------- obstacles ----------
function promptAhead(edgeX, key, label) {
  const d = edgeX - (cat.x + 7);
  if (d > 0 && d < 95) addPrompt(key, edgeX, GY - 52, false, -1, label);
}
function updateObstacles(dt) {
  G.climbable = null; cat.underCar = false;
  const front = cat.x + 7, back = cat.x - 7;
  const free = catFree() && G.state === 'play';
  const F = CONFIG.fence, S = CONFIG.sprinkler;
  for (let i = 0; i < OBS.length; i++) {
    const o = OBS[i]; if (!o.active) continue;
    o.t += dt;
    if (o.x + o.w < G.camX - 160 && o.x + o.w < dog.x - 160) { o.active = false; continue; }
    switch (o.type) {
      case 'puddle':
        if (o.done) break;
        if (back > o.x + o.w) o.done = 1;
        else if (free && cat.h < 1 && cat.x > o.x + 6 && cat.x < o.x + o.w - 6) {
          o.done = 1; hazardHit('SPLASH!', CONFIG.gap.puddle, 0.25); cat.vx *= 0.6; Sound.splash();
          for (let k = 0; k < 12; k++) emit(cat.x + rand(-6, 6), GY - 2, rand(-50, 50), rand(-90, -30), 0.6, '#6d8fb8', 1, 400);
        } else if (free) promptAhead(o.x, A.UP);
        break;
      case 'gnome':
        if (o.state === 1 && o.t < 0.4) o.x -= 30 * dt;
        if (o.done) break;
        if (back > o.x + o.w) o.done = 1;
        else if (free && front > o.x + 2 && back < o.x + o.w - 2 && cat.h < 14) {
          o.done = 1; o.state = 1; o.t = 0; hazardHit('TRIPPED!', CONFIG.gap.gnome, CONFIG.cat.stumbleTime); Sound.thud(0.5);
          for (let k = 0; k < 6; k++) emit(o.x + 6, GY - 8, rand(-40, 40), rand(-80, -20), 0.6, '#4a1414', 1, 300);
        } else if (free) promptAhead(o.x, A.UP);
        break;
      case 'sprinkler': {
        const per = S.on + S.off, ph = (o.t + o.phase) % per;
        o.state = ph < S.on ? 1 : 0;
        if (o.state === 1 && (G.frame & 1) && o.x - G.camX > -40 && o.x - G.camX < W + 40) {
          const dir = Math.sin(o.t * 5);
          emit(o.x, GY - 4, dir * 70 + rand(-10, 10), rand(-120, -90), 0.7, '#5d7ea8', 1, 300);
        }
        if (o.done) break;
        if (back > o.x + S.reach) o.done = 1;
        else if (free && o.state === 1 && cat.x > o.x - S.reach && cat.x < o.x + S.reach && cat.h < 20) {
          o.done = 1; hazardHit('SOAKED!', CONFIG.gap.sprinkler, 0.3); Sound.hiss(0.25); Sound.splash();
        } else if (free) promptAhead(o.x - S.reach, A.UP);
        break;
      }
      case 'branch': {
        const x0 = o.x + 20, x1 = o.x + 62;
        if (o.done) break;
        if (back > x1) o.done = 1;

          if (top > 13 && cat.h < 30) {
            o.done = 1; o.state = 1; o.t = 0; hazardHit('BONK!', CONFIG.gap.branch, CONFIG.cat.stumbleTime); Sound.thud(0.5);
            for (let k = 0; k < 8; k++) emit(cat.x + rand(-8, 8), GY - 20, rand(-30, 30), rand(-30, 10), 1.0, '#1d3324', 2, 120);
          }
        } else if (free) promptAhead(x0, A.DOWN);
        break;
      }
      case 'fence':
        if (o.done) break;
        if (free && front >= o.x) {
          o.done = 1;
          if (cat.h >= F.height - 2) {
            const win = lerp(F.perfectEasy, F.perfectHard, G.diff);
            if (cat.jumpTTF > 0 && Math.abs(cat.jumpTTF - F.idealTTF) <= win) {

            }
          } else { startScramble(o); addGap(-CONFIG.gap.fenceScramble); popup('SCRAMBLE', 'r'); }
        } else if (free) {
          const d = o.x - front;
          if (d > 0 && d < 110) {
            const win = lerp(F.perfectEasy, F.perfectHard, G.diff), ttf = d / Math.max(cat.vx, 1);
            addPrompt(A.UP, o.x + 8, GY - 52, Math.abs(ttf - F.idealTTF) <= win && cat.h < 1, -1, '');

              for (let k = 0; k < 8; k++) emit(o.x + 6, GY - 10, rand(-60, 10), rand(-80, -20), 0.7, '#3a3d44', 1, 300);
            }
          }
        } else if (o.state === 1 && o.t < 0.4) o.x -= 50 * dt;
        if (o.state === 1 && !o.done && dog.state === 'chase' && dog.x >= o.x) {

      case 'tree': {
        const trunk = o.x + 46;

          if (d > -16 && d < 26) { G.climbable = o; addPrompt(A.UP, trunk, GY - 58, true, -1, 'CLIMB'); }
          else if (d >= 26 && d < 110) addPrompt(A.UP, trunk, GY - 58, false, -1, 'CLIMB');

}

// ---------- dog ----------
function dogCircle(o, x) {
  dog.state = 'circle'; dog.circleO = o; dog.circleX = x; dog.circleT = 0; o.dogDone = 1;
  dog.confuseLeft = o.type === 'tree' ? CONFIG.tree.dogConfuse : CONFIG.wall.dogConfuse;
  dog.barkT = 0.2;
}
// Two-player: the arrow keys drive the dog's pace, charge and pounce
function dogPlayer(dt, sp) {
  const P = CONFIG.dogPlayer;
  if (DH[A.LEFT] && !DH[A.RIGHT]) sp *= P.holdBackFactor;
  else if (!DH[A.RIGHT]) sp *= P.idleFactor;
  dog.charging = DH[A.SPRINT] && !dog.exhausted && dog.stam > 0 && dog.stun <= 0;
  if (dog.charging) { sp += P.chargeBonus; dog.stam -= P.chargeDrain * dt; if (dog.stam <= 0) { dog.stam = 0; dog.exhausted = true; } }
  else { dog.stam = Math.min(1, dog.stam + P.chargeRegen * dt); if (dog.exhausted && dog.stam >= 0.25) dog.exhausted = false; }
  if (DT[A.UP] && dog.pounceCD <= 0 && dog.stun <= 0) { dog.pounceCD = P.pounceCooldown; dog.debt -= P.pounce; dog.pounceT = 0.45; Sound.snarl(0.35); }
  return sp;
}
function updateDog(dt) {
  if (dog.pounceCD > 0) dog.pounceCD -= dt;
  const D = CONFIG.dog;
  dog.blinkT -= dt; if (dog.blinkT <= 0) { dog.blink = 0.12; dog.blinkT = rand(2, 5); }
  if (dog.blink > 0) dog.blink -= dt;
  dog.hopH = 0;
  switch (dog.state) {
    case 'chase': {
      let sp = Math.min(D.maxSpeed, D.baseSpeed + D.accel * G.t);
      if (G.twoP && G.state === 'play') sp = dogPlayer(dt, sp);
      const g0 = gap();
      if (g0 > D.catchupStart) sp += (g0 - D.catchupStart) * D.catchupBonus;
      if (G.state === 'win') sp = 0;
      let move = sp * dt;
      if (dog.stun > 0) { dog.stun -= dt; move = -10 * dt; }
      if (dog.debt > 0) { const c = Math.min(dog.debt, D.debtRate * dt); dog.debt -= c; move -= c; }
      else if (dog.debt < 0) { const c = Math.min(-dog.debt, D.surgeRate * dt); dog.debt += c; move += c; }
      if (move < -30 * dt) move = -30 * dt;
      dog.x += move;
      dog.anim += Math.max(0, move) / 70;
      if (dog.pounceT > 0) { dog.pounceT -= dt; dog.hopH = Math.max(dog.hopH, Math.sin(clamp(1 - dog.pounceT / 0.45, 0, 1) * Math.PI) * 16); }
      dog.facing = 1;
      if (gap() > CONFIG.gap.max) dog.x = cat.x - 7 - CONFIG.gap.max;
      // obstacles that matter to the dog
      for (let i = 0; i < OBS.length; i++) {
        const o = OBS[i]; if (!o.active) continue;
        if (o.type === 'car') {
          const mid = dog.x - 40; if (mid > o.x && mid < o.x + o.w) dog.hopH = Math.sin((mid - o.x) / o.w * Math.PI) * 30;
        } else if (o.type === 'tree' && !o.dogDone && o.state > 0) {
          const trunk = o.x + 46;
          if (dog.x >= trunk - 14 && dog.x < trunk + 60) {
            if (cat.tree === o && cat.state === 'climb' && cat.h < CONFIG.tree.safe) { startLunge(); return; }
            dogCircle(o, trunk - 16); Sound.bark(0.6, true); return;
          }
        } else if (o.type === 'alley' && !o.dogDone && o.state > 0) {
          const ent = o.x - 30;
          if (dog.x >= ent - 6) {
            if (cat.wall === o && cat.h < CONFIG.wall.safe) { startLunge(); return; }
            dogCircle(o, ent - 4); Sound.bark(0.6, true); return;
          }
        }
      }
      // keep the dog under a cat that is out of reach
      if (catSafe() && gap() < 6) dog.x = cat.x - 13;
      if (G.state === 'play' && G.t < CONFIG.runLength && gap() <= CONFIG.gap.lungeAt && !catSafe()) startLunge();
      break;
    }
    case 'circle': {
      const o = dog.circleO;
      dog.circleT += dt;
      const catStill = (o.type === 'tree' && cat.tree === o) || (o.type === 'alley' && cat.wall === o);
      dog.x = dog.circleX + Math.sin(dog.circleT * 2.4) * 16;
      dog.facing = Math.cos(dog.circleT * 2.4) >= 0 ? 1 : -1;
      dog.anim += dt * 2;
      dog.barkT -= dt; if (dog.barkT <= 0) { dog.barkT = rand(0.7, 1.2); Sound.bark(0.45); }
      if (catStill) {
        dog.confuseLeft = o.type === 'tree' ? CONFIG.tree.dogConfuse : CONFIG.wall.dogConfuse;
        const safeH = o.type === 'tree' ? CONFIG.tree.safe : CONFIG.wall.safe;
        if (cat.h < safeH - 6 && gap() < 30) { startLunge(); return; }
      } else {
        dog.confuseLeft -= dt;
        if (dog.confuseLeft <= 0) { dog.state = 'chase'; dog.facing = 1; dog.x = Math.max(dog.x, dog.circleX); }
      }
      break;
    }
    case 'retreat':
      dog.facing = -1; dog.x -= 80 * dt; dog.anim += 80 * dt / 70; dog.alpha = Math.max(0, dog.alpha - dt * 0.5);
      break;
    case 'lunge':
      dog.anim += dt;
      break;
  }
  // paw thumps synced to the run cycle
  const fr = Math.floor(dog.anim * 6) % 6;
  if (fr !== dog.frame) {
    dog.frame = fr;
    if ((fr === 1 || fr === 4) && (dog.state === 'chase' || dog.state === 'retreat') && G.state === 'play') {
      const near = clamp(1 - gap() / 260, 0, 1);
      Sound.paw(0.03 + near * near * 0.45);
    }
  }
}

// ---------- jump scare ----------
function scheduleScares() {
  const S = CONFIG.scare, sc = G.scare;
  sc.times[0] = rand(S.firstMin, S.firstMax);
  sc.n = Math.random() < S.secondChance ? 2 : 1;
  sc.times[1] = rand(S.secondMin, S.secondMax);
  sc.idx = 0; sc.phase = 0; sc.t = 0; sc.hedge = null;
}
function updateScare(dt, rawDt) {
  const S = CONFIG.scare, sc = G.scare;
  if (sc.phase === 0) {
    if (sc.idx >= sc.n || G.t < sc.times[sc.idx] || G.t > CONFIG.runLength - 15) { G.spawnHold = false; return; }
    if (G.t > sc.times[sc.idx] + 20) { sc.idx++; G.spawnHold = false; return; }   // never found a quiet moment
    G.spawnHold = true;                           // let the street clear before the scare
    if (dog.state !== 'chase' || dog.stun > 0 || gap() < 35 || cat.state !== 'run' || G.qte.active) return;
    for (let i = 0; i < OBS.length; i++) { const o = OBS[i];
      if (o.active && o.x + o.w > cat.x - 20 && o.x < G.camX + W + 10 && o.type !== 'hedge') return; }
    for (let i = 0; i < OBS.length; i++) if (OBS[i].active && OBS[i].x > G.camX + W) OBS[i].active = false;
    sc.phase = 1; sc.t = 0; G.spawnPause = true; G.spawnHold = false;
    const hx = G.camX + W + 150; spawnSegment('hedge', hx);
    for (let i = 0; i < OBS.length; i++) if (OBS[i].active && OBS[i].type === 'hedge' && OBS[i].x === hx) { sc.hedge = OBS[i]; OBS[i].flag = 1; OBS[i].layer = 1; }
    G.nextSpawnX = hx + 68 + 200;
  } else if (sc.phase === 1) {                    // the dog goes silent and fades away
    sc.t += dt; dog.alpha = Math.max(0, 1 - sc.t / S.fadeTime);
    if (sc.t >= S.fadeTime) { sc.phase = 2; dog.state = 'hidden'; dog.alpha = 0; }
  } else if (sc.phase === 2) {                    // silence… then the hedge
    const h = sc.hedge;
    if (!h || !h.active) { endScare(true); return; }
    if (h.x - (cat.x + 7) < 22) h.phase = 1;      // rustle
    if (h.x + 10 - (cat.x + 7) <= S.triggerDist) {
      sc.phase = 3; sc.t = 0; dog.state = 'burst'; dog.burstT = 0; dog.crossed = false; dog.facing = -1; dog.alpha = 1;
      dog.x = h.x + 24; G.flash = 0.9; G.shake = 1.2; Sound.sting(); Sound.snarl(0.7); Sound.bark(0.9);
      for (let k = 0; k < 24; k++) emit(h.x + rand(10, 58), GY - rand(10, 34), rand(-90, 60), rand(-120, -20), 1.0, '#1d3324', 2, 200);
    }
  } else if (sc.phase === 3) {                    // BURST — jump over it!
    sc.t += rawDt; dog.burstT += rawDt;
    if (dog.burstT > S.emerge) dog.x -= S.dogSpeed * rawDt;
    dog.hopH = Math.sin(clamp(dog.burstT / 0.8, 0, 1) * Math.PI) * 16;
    dog.anim += rawDt * 2;
    if (!dog.crossed) addPrompt(A.UP, 0, -44, true, -1, 'JUMP!', false);
    if (!dog.crossed && dog.x <= cat.x + 4) {
      dog.crossed = true;
      if (cat.h > 10) { popup('DODGED!', 'y'); Sound.hiss(0.45); }
      else { sc.phase = 0; sc.idx++; G.spawnPause = false; G.nextSpawnX = Math.max(G.nextSpawnX, G.camX + W + 60); dog.facing = -1; startLunge(); return; }
    }
    if (dog.crossed && dog.burstT > 0 && dog.x < cat.x - 150) {
      const s = 1 + G.danger * CONFIG.dog.growScale;
      dog.x = dog.x + 90 * s; dog.facing = 1; dog.state = 'chase'; dog.stun = 0.3; dog.debt = 0;
      endScare(false);
    }
  }
}
function endScare() {
  const sc = G.scare; sc.phase = 0; sc.idx++; G.spawnPause = false;
  G.nextSpawnX = Math.max(G.nextSpawnX, G.camX + W + 60);
  if (dog.state === 'hidden') { dog.state = 'chase'; dog.alpha = 1; dog.x = cat.x - 7 - 120; }
}

// ---------- the lunge / quick-time event ----------
function startLunge() {
  if (G.qte.active || G.state !== 'play') return;
  const q = G.qte, Q = CONFIG.qte;
  q.active = true; q.idx = 0;
  q.len = G.qteCount === 0 ? Q.keysEasy : (G.diff > 0.45 || G.qteCount >= 2 ? Q.keysHard : randi(Q.keysEasy, Q.keysHard));
  for (let i = 0; i < q.len; i++) { let k; do { k = randi(0, 3); } while (i > 0 && k === q.keys[i - 1]); q.keys[i] = k; }
  for (let i = 0; i < q.len; i++) { let k; do { k = randi(0, 3); } while (i > 0 && k === q.dkeys[i - 1]); q.dkeys[i] = k; }
  q.didx = 0;
  q.total = Math.max(Q.minTime, lerp(Q.timeEasy, Q.timeHard, G.diff) - G.qteCount * Q.perUseCut);
  q.timer = q.total;
  cat.prevState = cat.state; cat.state = 'qte';
  dog.state = 'lunge';
  if (dog.facing === 1) dog.x = cat.x - 9; else dog.x = cat.x + 9;
  G.shake = Math.max(G.shake, 0.9); Sound.snarl(0.6); Sound.bark(0.8);
  Input.clearHits();
}
function updateQTE(rawDt) {
  const q = G.qte;
  q.timer -= rawDt;
  if (!G.twoP) {                    // solo: one wrong key and you're caught
    for (let a = 0; a < 4; a++) {
      if (!Input.hit[a]) continue;
      if (a === q.keys[q.idx]) { Sound.blip(q.idx); q.idx++; if (q.idx >= q.len) { qteSuccess(); return; } }
      else { qteFail(); return; }
    }
  } else {                          // two players: race to finish your own sequence; a wrong key resets yours
    for (let a = 0; a < 4; a++) {
      if (CT[a]) {
        if (a === q.keys[q.idx]) { Sound.blip(q.idx); q.idx++; if (q.idx >= q.len) { qteSuccess(); return; } }
        else { q.idx = 0; Sound.thud(0.2); }
      }
      if (DT[a]) {
        if (a === q.dkeys[q.didx]) { Sound.blip(q.didx + 2); q.didx++; if (q.didx >= q.len) { qteFail(); return; } }
        else { q.didx = 0; Sound.thud(0.2); }
      }
    }
  }
  if (q.timer <= 0) qteFail();
}
function qteSuccess() {
  const q = G.qte; q.active = false; G.qteCount++;
  const ps = cat.prevState;
  if (ps === 'climb' || ps === 'treetop') cat.state = ps;
  else if (ps === 'wall') { cat.state = 'wall'; cat.wallPhase = 0; cat.wallT = 0; }
  else { cat.state = 'twist'; cat.twistT = 0; cat.vy = 170; cat.vx = Math.max(cat.vx, 130); }
  dog.state = 'chase'; dog.facing = 1; dog.stun = CONFIG.qte.stun; dog.debt = 0;
  dog.x = cat.x - 7 - CONFIG.qte.restoreGap;
  Sound.hiss(0.5); popup('TWISTED FREE!', 'y'); G.shake = 0.6; G.flash = 0.3;
}
function qteFail() { G.qte.active = false; Sound.fail(); startCaught(); }

// ---------- atmosphere: danger, heartbeat, growl, ambient events ----------
function updateAtmos(dt, inPlay) {
  let target = 0;
  if (inPlay) {
    if (dog.state === 'hidden' || (G.scare.phase === 1)) target = 0.3;
    else if (dog.state === 'lunge' || G.qte.active || dog.state === 'burst') target = 1;
    else if (dog.state === 'chase' || dog.state === 'circle') target = clamp(1 - gap() / CONFIG.gap.dangerRange, 0, 1);
  } else if (G.state === 'intro') target = smooth(1.2, 3.5, G.introT) * 0.55;
  G.danger += (target - G.danger) * Math.min(1, dt * 4);

  if (G.state === 'play' || G.state === 'intro') {
    G.heartT += dt;
    const period = 60 / (60 + G.danger * 100);
    if (G.heartT >= period) { G.heartT = 0; Sound.heart(0.09 + G.danger * 0.5); G.heartPulse = 1; }
  }
  G.heartPulse = Math.max(0, G.heartPulse - dt * 5);
  G.shake = Math.max(0, G.shake - dt * 1.8);
  G.flash = Math.max(0, G.flash - dt * 3);

  if ((G.frame % 6) === 0) {
    let lvl = 0;
    if (G.state === 'play' && (dog.state === 'chase' || dog.state === 'circle' || dog.state === 'lunge')) lvl = 0.08 + G.danger * 0.92;
    else if (G.state === 'intro' && G.introT > 1.2) lvl = 0.35;
    Sound.setGrowl(lvl);
  }

  G.ambientT -= dt;
  if (G.ambientT <= 0) {
    G.ambientT = rand(7, 15); const r = Math.random();
    if (r < 0.4) Sound.chimes(); else if (r < 0.62) Sound.howl(); else Sound.gust();
  }
}

function updateDecor(dt) {
  updateDecorSpawns();
  for (let i = 0; i < LAMPS.length; i++) {
    const l = LAMPS[i]; if (!l.active) continue;
    l.t += dt; l.next -= dt;
    const dogNear = (dog.state === 'chase' || dog.state === 'burst') && Math.abs(l.x + 25 - dog.x) < 70;
    if (l.next <= 0) {
      if (l.mode === 0 && !dogNear) { l.i = 0.9 + Math.random() * 0.1; l.next = rand(0.05, 0.3); if (Math.random() < 0.03) { l.i = 0.1; l.next = 0.06; } }
      else if (l.mode === 1 || dogNear) { l.i = Math.random() < 0.5 ? rand(0, 0.25) : rand(0.7, 1); l.next = rand(0.03, 0.18); }
      else { l.i = Math.random() < 0.15 ? rand(0.4, 0.8) : 0; l.next = rand(0.05, 0.6); }
    }
  }
  const hp = G.camX * 0.8;
  for (let i = 0; i < HOUSES.length; i++) {
    const h = HOUSES[i]; if (!h.active) continue;
    const def = SPR.houses[h.v], sx = h.x - hp;
    if (h.porch && !h.porchOn && sx + def.porch[0] < cat.x - G.camX + 30 && G.state === 'play') { h.porchOn = true; Sound.click(0.25); }
    if (h.curtain >= 0) h.curtainT += dt;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < PARTS.length; i++) {
    const p = PARTS[i]; if (!p.active) continue;
    p.life -= dt; if (p.life <= 0) { p.active = false; continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > GY + 2 && p.vy > 0) { p.y = GY + 2; p.vy *= -0.2; p.vx *= 0.5; }
  }
}
function updatePopups(dt) {
  for (let i = 0; i < POPS.length; i++) { const p = POPS[i]; if (!p.active) continue; p.t += dt; p.y -= 18 * dt; if (p.t > 1.0) p.active = false; }
}
function updateCamera(dt) {
  const target = cat.x - CONFIG.CAMERA_X;
  G.camX += (target - G.camX) * Math.min(1, dt * 8);
}
function updateClock() {
  const m = Math.floor(Math.min(G.t, CONFIG.runLength) * 180 / CONFIG.runLength);
  if (m !== G.clockMin) { G.clockMin = m; G.clockStr = fmtClock(G.t); }
}

// ==========================================================================
// 10. RENDERING
// ==========================================================================
const rnd = v => Math.round(v * RES) / RES;   // snap to device pixels
function tile(img, off, y) {
  const w = img.lw; let x = -((((Math.floor(off * RES) / RES) % w) + w) % w);
  if (x > -8) x -= w;
  for (; x < W + 8; x += w) ctx.drawImage(img, x, y, img.lw, img.lh);
}

function drawObstacle(o, cx) {
  const x = rnd(o.x - cx);
  switch (o.type) {
    case 'puddle': ctx.drawImage(SPR.puddle, x, GY - 4, SPR.puddle.lw, SPR.puddle.lh); break;
    case 'gnome': if (o.state === 0) ctx.drawImage(SPR.gnome, x, GY - 18, SPR.gnome.lw, SPR.gnome.lh); else ctx.drawImage(SPR.gnomeDown, x - 4, GY - 16, SPR.gnomeDown.lw, SPR.gnomeDown.lh); break;
    case 'sprinkler': ctx.drawImage(SPR.sprinkler, x - 4, GY - 5, SPR.sprinkler.lw, SPR.sprinkler.lh); break;
    case 'branch': {
      const sh = o.state === 1 && o.t < 0.5 ? rnd(Math.sin(o.t * 40) * 2 * (1 - o.t * 2)) : 0;
      ctx.drawImage(SPR.branch, x, GY - 72 + sh, SPR.branch.lw, SPR.branch.lh); break;
    }
    case 'fence': ctx.drawImage(SPR.fence, x - 2, GY - 30, SPR.fence.lw, SPR.fence.lh); break;
    case 'car': ctx.drawImage(SPR.car, x - 2, GY - 36, SPR.car.lw, SPR.car.lh); break;
    case 'trash':
      if (o.state === 0) ctx.drawImage(SPR.can, x - 1, GY - 22, SPR.can.lw, SPR.can.lh);
      else ctx.drawImage(SPR.canDown, x - 6, GY - 19, SPR.canDown.lw, SPR.canDown.lh);
      break;
    case 'tree': ctx.drawImage(SPR.shed, x + 60, GY - 64, SPR.shed.lw, SPR.shed.lh); ctx.drawImage(SPR.tree, x, GY - 160, SPR.tree.lw, SPR.tree.lh); break;
    case 'alley': if (o.layer === 0) break; ctx.drawImage(SPR.bldgR, x, GY - 96, SPR.bldgR.lw, SPR.bldgR.lh); break;
    case 'hedge': {
      let sh = 0;
      if (o.flag && o.phase) sh = rnd(Math.sin(G.time * 50));
      if (o.flag && G.scare.phase === 3 && G.scare.hedge === o) sh = rnd(Math.sin(G.time * 70) * 2);
      ctx.drawImage(SPR.hedge, x + sh, GY - 40, SPR.hedge.lw, SPR.hedge.lh); break;
    }
    case 'home': ctx.drawImage(SPR.home, x, GY - 120, SPR.home.lw, SPR.home.lh); break;
  }
}
function drawObstaclesLayer(layer, cx) {
  for (let i = 0; i < OBS.length; i++) {
    const o = OBS[i]; if (!o.active) continue;
    if (o.x - cx > W + 20 || o.x + o.w + 80 - cx < -60) continue;
    if (o.type === 'alley') {         // left building is behind everything, right building in front
      if (layer === 0) ctx.drawImage(SPR.bldgL, rnd(o.x - 76 - cx), GY - 124, SPR.bldgL.lw, SPR.bldgL.lh);
      else ctx.drawImage(SPR.bldgR, rnd(o.x - cx), GY - 96, SPR.bldgR.lw, SPR.bldgR.lh);
      continue;
    }
    if (o.layer === layer) drawObstacle(o, cx);
  }
}

function dogFrame() {
  const L = dog.facing < 0;
  switch (dog.state) {
    case 'lunge': return L ? SPR.dogLungeL : SPR.dogLunge;
    case 'circle': {
      if (dog.barkT > 0.55) return L ? SPR.dogBarkL[0] : SPR.dogBark[0];
      const f = Math.floor(dog.anim * 6) % 6; return L ? SPR.dogRunL[f] : SPR.dogRun[f];
    }
    case 'burst': return dog.burstT < 0.5 ? SPR.dogLungeL : SPR.dogRunL[Math.floor(dog.anim * 6) % 6];
    case 'intro': return G.introT > 3.0 ? SPR.dogBark[G.introT % 0.5 < 0.25 ? 0 : 1] : SPR.dogBark[1];
    default: { const f = Math.floor(dog.anim * 6) % 6; return L ? SPR.dogRunL[f] : SPR.dogRun[f]; }
  }
}
let dogEyeX = 0, dogEyeY = 0, dogEyeS = 1, dogEyeA = 0;
function drawDog(cx) {
  dogEyeA = 0;
  if (dog.state === 'hidden' || dog.alpha <= 0.01) return;
  const fr = dogFrame();
  const s = 1 + G.danger * CONFIG.dog.growScale;
  const w = fr.c.lw * s, h = fr.c.lh * s;
  const sx = rnd(dog.x - cx - fr.nose * s), sy = rnd(GY - h + s - dog.hopH);
  if (sx > W || sx + w < 0) return;
  const visible = dog.state !== 'intro' || G.introT > 3.0;
  if (visible) {
    ctx.globalAlpha = dog.alpha * 0.8 * (1 - clamp(dog.hopH / 40, 0, 0.7));
    ctx.drawImage(SPR.shadow, dog.x - cx - 70 * s, GY - 5 * s, 64 * s, 9 * s);
    if (dog.alpha < 1) ctx.globalAlpha = dog.alpha;
    ctx.drawImage(fr.c, sx, sy, w, h);
    ctx.globalAlpha = 1;
  }
  dogEyeX = sx + fr.ex * s; dogEyeY = sy + fr.ey * s; dogEyeS = s;
  dogEyeA = dog.alpha * (dog.blink > 0 ? 0 : 1) * (dog.state === 'intro' ? dog.eyesK : 1);
}

let catSX = 0, catSY = 0;
function drawCat(cx) {
  const sx = rnd(cat.x - cx), fy = rnd(GY - cat.h);
  catSX = sx; catSY = fy - 8;
  if (!cat.visible) return;
  if (cat.h < 40 && cat.state !== 'flap') {
    ctx.globalAlpha = 0.75 * (1 - cat.h / 40);
    ctx.drawImage(SPR.shadow, sx - 13, GY - 3, 26, 6); ctx.globalAlpha = 1;
  }
  let spr = null, rot = false, jx = 0;
  switch (cat.state) {
    case 'run': spr = SPR.catRun[Math.floor(cat.anim * 6) % 6]; break;
    case 'stumble': spr = SPR.catFall; jx = (G.frame & 2) ? 1 : -1; break;
    case 'slide': spr = SPR.catSlide; break;
    case 'air': spr = cat.vy > 40 ? SPR.catJump : SPR.catFall; break;
    case 'twist': spr = SPR.catSpin[Math.floor(cat.twistT * 18) % 4]; rot = true; break;
    case 'climb': spr = SPR.catClimb[cat.climbAnim]; rot = true; break;
    case 'treetop': case 'sit': spr = SPR.catSit; break;
    case 'alert': spr = SPR.catFall; break;
    case 'wall':
      if (cat.wallPhase === 1) spr = cat.wallSide ? SPR.catJump : SPR.catJumpL;
      else { spr = cat.wallSide ? SPR.catClimb[0] : SPR.catClimbL[0]; rot = true; }
      break;
    case 'scramble': spr = SPR.catScramble; rot = true; break;
    case 'qte': spr = SPR.catFall; jx = (G.frame & 2) ? 1 : -1; break;
    case 'caught': spr = SPR.catFall; break;
    case 'flap': {
      const k = clamp(cat.flapT / 0.4, 0, 1);
      if (k >= 1) return;
      const fw = 32 * (1 - k); ctx.drawImage(SPR.catRun[Math.floor(cat.anim * 6) % 6], 0, 0, fw * RES, 20 * RES, sx - 16, fy - 19, fw, 20);
      return;
    }
    default: spr = SPR.catRun[0];
  }
  if (rot) ctx.drawImage(spr, sx - spr.lw / 2 + jx, fy - 12 - spr.lh / 2, spr.lw, spr.lh);
  else ctx.drawImage(spr, sx - 16 + jx, fy - 19, spr.lw, spr.lh);
}

function drawHouses(cx) {
  const hp = cx * 0.8;
  for (let i = 0; i < HOUSES.length; i++) {
    const h = HOUSES[i]; if (!h.active) continue;
    const def = SPR.houses[h.v], x = rnd(h.x - hp), y = GY - 114;
    if (x > W || x + 150 < 0) continue;
    ctx.drawImage(def.c, x, y, def.c.lw, def.c.lh);
    for (let k = 0; k < def.win.length; k++) {
      if (!h.lit[k]) continue; const wv = def.win[k];
      ctx.fillStyle = '#c9a35a'; ctx.fillRect(x + wv[0], y + wv[1], wv[2], wv[3]);
      if (k === h.curtain) {
        const open = clamp(Math.sin(h.curtainT * 0.9) * 1.6, 0, 1);
        const cw = rnd(wv[2] * (0.5 - open * 0.38));
        ctx.fillStyle = '#5a3d24'; ctx.fillRect(x + wv[0], y + wv[1], cw, wv[3]); ctx.fillRect(x + wv[0] + wv[2] - cw, y + wv[1], cw, wv[3]);
        if (open > 0.6) { ctx.fillStyle = '#1a120c'; ctx.fillRect(x + wv[0] + (wv[2] >> 1) - 2, y + wv[1] + 4, 4, wv[3] - 4); ctx.fillRect(x + wv[0] + (wv[2] >> 1) - 1, y + wv[1] + 2, 2, 2); }
      } else { ctx.fillStyle = '#7a5a30'; ctx.fillRect(x + wv[0], y + wv[1] + (wv[3] >> 1), wv[2], 1); ctx.fillRect(x + wv[0] + (wv[2] >> 1), y + wv[1], 1, wv[3]); }
    }
    if (h.porchOn) { ctx.fillStyle = '#ffe2a0'; ctx.fillRect(x + def.porch[0] - 1, y + def.porch[1] - 2, 3, 3); }
  }
}

function composeDarkness(cx, sx, sy) {
  const g = SPR.darkG;
  g.globalCompositeOperation = 'copy'; g.globalAlpha = 1; g.drawImage(SPR.darkBase, 0, 0, SPR.darkBase.lw, SPR.darkBase.lh);
  g.globalCompositeOperation = 'destination-out';
  const R = CONFIG.lightRadius;
  if (cat.visible && G.state !== 'title') g.drawImage(SPR.catLight, catSX - R + sx, catSY - R + sy, SPR.catLight.lw, SPR.catLight.lh);
  for (let i = 0; i < LAMPS.length; i++) {
    const l = LAMPS[i]; if (!l.active || l.i < 0.02) continue;
    const lx = rnd(l.x + 25 - cx) + sx; if (lx < -80 || lx > W + 80) continue;
    g.globalAlpha = l.i; g.drawImage(SPR.cone, lx - 75, GY - 128 + sy, SPR.cone.lw, SPR.cone.lh); g.drawImage(SPR.pool, lx - 70, GY - 12 + sy, SPR.pool.lw, SPR.pool.lh);
  }
  const hp = cx * 0.8;
  for (let i = 0; i < HOUSES.length; i++) {
    const h = HOUSES[i]; if (!h.active) continue;
    const def = SPR.houses[h.v], x = rnd(h.x - hp) + sx, y = GY - 114 + sy;
    if (x > W || x + 150 < 0) continue;
    g.globalAlpha = 0.6;
    for (let k = 0; k < def.win.length; k++) if (h.lit[k]) { const wv = def.win[k]; g.drawImage(SPR.small, x + wv[0] - 10, y + wv[1] - 10, wv[2] + 20, wv[3] + 20); }
    if (h.porchOn) { g.globalAlpha = 0.9; g.drawImage(SPR.small, x + def.porch[0] - 34, y + def.porch[1] - 30, 68, 68); }
  }
  if (G.home) {
    const x = rnd(G.home.x - cx) + sx;
    g.globalAlpha = 1; g.drawImage(SPR.small, x + 105 - 45, GY - 50 - 45 + sy, 90, 90);
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

function drawGlows(cx) {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < LAMPS.length; i++) {
    const l = LAMPS[i]; if (!l.active || l.i < 0.02) continue;
    const lx = rnd(l.x + 25 - cx); if (lx < -80 || lx > W + 80) continue;
    ctx.globalAlpha = l.i * 0.9; ctx.drawImage(SPR.glowWarm, lx - 24, GY - 154, SPR.glowWarm.lw, SPR.glowWarm.lh);
    ctx.globalAlpha = l.i * 0.6; ctx.drawImage(SPR.coneGlow, lx - 75, GY - 128, SPR.coneGlow.lw, SPR.coneGlow.lh);
  }
  const hp = cx * 0.8;
  for (let i = 0; i < HOUSES.length; i++) {
    const h = HOUSES[i]; if (!h.active) continue;
    const def = SPR.houses[h.v], x = rnd(h.x - hp), y = GY - 114;
    if (x > W || x + 150 < 0) continue;
    ctx.globalAlpha = 0.3;
    for (let k = 0; k < def.win.length; k++) if (h.lit[k]) { const wv = def.win[k]; ctx.drawImage(SPR.glowWarm, x + wv[0] - 8, y + wv[1] - 8, wv[2] + 16, wv[3] + 16); }
    if (h.porchOn) { ctx.globalAlpha = 0.8; ctx.drawImage(SPR.glowWarm, x + def.porch[0] - 24, y + def.porch[1] - 24, SPR.glowWarm.lw, SPR.glowWarm.lh); }
  }
  if (G.home) { ctx.globalAlpha = 0.9; ctx.drawImage(SPR.glowWarm, rnd(G.home.x - cx) + 105 - 24, GY - 50 - 24, SPR.glowWarm.lw, SPR.glowWarm.lh); }
  if (dogEyeA > 0.01) {
    const s = dogEyeS * (G.state === 'intro' && G.introT < 3 ? 1.3 : 1);
    ctx.globalAlpha = dogEyeA; ctx.drawImage(SPR.eyeGlow, dogEyeX - 8 * s, dogEyeY - 8 * s, 16 * s, 16 * s);
    ctx.drawImage(SPR.eyeGlow, dogEyeX + 3 * dog.facing * s - 6 * s, dogEyeY - 6 * s, 12 * s, 12 * s);
  }
  if (cat.visible && G.state !== 'title' && (cat.state === 'run' || cat.state === 'air' || cat.state === 'sit' || cat.state === 'treetop')) {
    ctx.globalAlpha = 0.6; ctx.drawImage(SPR.catEyeGlow, catSX + 5, catSY - 12, SPR.catEyeGlow.lw, SPR.catEyeGlow.lh);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (dogEyeA > 0.2) {
    const eh = G.state === 'intro' ? Math.max(1, rnd(dog.eyesK * 2)) : 1;
    ctx.fillStyle = '#ff7a50';
    ctx.fillRect(rnd(dogEyeX - 1), rnd(dogEyeY), 2, eh);
    ctx.fillRect(rnd(dogEyeX + 3 * dog.facing * dogEyeS - 1), rnd(dogEyeY), 2, eh);
  }
}

function drawParticles(cx) {
  for (let i = 0; i < PARTS.length; i++) {
    const p = PARTS[i]; if (!p.active) continue;
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
    ctx.fillStyle = p.col; ctx.fillRect(rnd(p.x - cx), rnd(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  const cx = rnd(G.camX);
  let sx = 0, sy = 0;
  const sh = G.shake * 5 + (G.state === 'play' ? G.danger * G.danger * 1.6 : 0);
  if (sh > 0.4) { sx = rnd((Math.random() * 2 - 1) * sh); sy = rnd((Math.random() * 2 - 1) * sh); }
  G.sx = sx; G.sy = sy;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  ctx.drawImage(SPR.skyNight, 0, 0, SPR.skyNight.lw, SPR.skyNight.lh);
  if (G.dawn > 0) { ctx.globalAlpha = G.dawn; ctx.drawImage(SPR.skyDawn, 0, 0, SPR.skyDawn.lw, SPR.skyDawn.lh); ctx.globalAlpha = 1; }
  ctx.globalAlpha = 1 - G.dawn * 0.7;
  ctx.drawImage(SPR.moonGlow, MOON_X - 70, MOON_Y - 70 + G.dawn * 30, SPR.moonGlow.lw, SPR.moonGlow.lh); ctx.drawImage(SPR.moon, MOON_X - 11, MOON_Y - 11 + G.dawn * 30, SPR.moon.lw, SPR.moon.lh);
  ctx.globalAlpha = 1;
  ctx.setTransform(RES, 0, 0, RES, sx * RES, sy * RES);
  tile(SPR.clouds, cx * 0.06 + G.time * 4, 12);
  tile(SPR.farHouses, cx * 0.25, GY - 86);
  tile(SPR.treeLayer, cx * 0.5, GY - 158);
  drawHouses(cx);
  tile(SPR.ground, cx, GY - 6);
  for (let i = 0; i < LAMPS.length; i++) { const l = LAMPS[i]; if (l.active) ctx.drawImage(SPR.lamp, rnd(l.x - cx), GY - 140, SPR.lamp.lw, SPR.lamp.lh); }
  drawObstaclesLayer(0, cx);
  drawParticles(cx);
  drawDog(cx);
  drawCat(cx);
  drawObstaclesLayer(1, cx);
  // fog layers (lit only where light reaches)
  ctx.globalAlpha = 0.85; tile(SPR.fog[0], cx * 0.7 + G.time * 8, GY - 60);
  ctx.globalAlpha = 0.7; tile(SPR.fog[1], cx * 1.1 + G.time * 14, GY - 34);
  ctx.globalAlpha = 1;
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  // darkness
  composeDarkness(cx, sx, sy);
  ctx.globalAlpha = 1 - G.dawn * 0.85; ctx.drawImage(SPR.darkBuf, 0, 0, SPR.darkBuf.lw, SPR.darkBuf.lh); ctx.globalAlpha = 1;
  ctx.setTransform(RES, 0, 0, RES, sx * RES, sy * RES);
  drawGlows(cx);
  tile(SPR.fg, cx * 1.4, H - 44);
  ctx.globalAlpha = 0.14; tile(SPR.fog[2], cx * 0.4 + G.time * 5, GY - 110); ctx.globalAlpha = 1;
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  // danger: red vignette + desaturation
  if (G.danger > 0.02 && (G.state === 'play' || G.state === 'intro')) {
    ctx.globalAlpha = Math.min(1, Math.pow(G.danger, 1.4) * (0.75 + 0.25 * G.heartPulse));
    ctx.drawImage(SPR.redVig, 0, 0, SPR.redVig.lw, SPR.redVig.lh);
    ctx.globalCompositeOperation = 'saturation';
    ctx.globalAlpha = G.danger * 0.55; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
}

function drawPrompts() {
  const cx = rnd(G.camX);
  for (let i = 0; i < promptCount; i++) {
    const p = PROMPTS[i];
    let x, y;
    if (p.world) { x = rnd(p.x - cx); y = p.y; } else { x = catSX + p.x; y = catSY + p.y; }
    const bob = rnd(Math.sin(G.time * 8) * (p.hi ? 1.5 : 1));
    const pulse = p.hi && (G.time * 6 % 1) < 0.5;
    const key = (G.twoP ? SPR.keysW : SPR.keys)[p.key][p.hi ? 1 : 0];
    if (pulse) ctx.drawImage(key, x - 7 - 1, y + bob - 1, 16, 17); else ctx.drawImage(key, x - 7, y + bob, key.lw, key.lh);
    if (p.bar >= 0) { ctx.fillStyle = '#000'; ctx.fillRect(x - 8, y + bob + 17, 16, 3); ctx.fillStyle = p.bar < 0.35 ? '#e0393a' : '#f3c64f'; ctx.fillRect(x - 7, y + bob + 18, rnd(14 * clamp(p.bar, 0, 1)), 1); }
    if (p.label) textS(p.label, x, y + bob - 10, p.hi ? 'y' : 'w', 1, 1);
  }
}
function drawPopups() {
  for (let i = 0; i < POPS.length; i++) {
    const p = POPS[i]; if (!p.active) continue;
    if (p.t > 0.7 && (G.frame & 2)) continue;
    textS(p.str, p.x, p.y, p.col, 1, 1);
  }
}

function drawHUD() {
  // heart + gap meter
  const big = G.heartPulse > 0.55;
  if (big) ctx.drawImage(SPR.heartBig, 5, 4, SPR.heartBig.lw, SPR.heartBig.lh); else ctx.drawImage(SPR.heart, 6, 5, SPR.heart.lw, SPR.heart.lh);
  const hidden = dog.state === 'hidden' || G.scare.phase === 1;
  const gw = 100, gx = 18, gyy = 6;
  ctx.fillStyle = '#000'; ctx.fillRect(gx - 1, gyy - 1, gw + 2, 7);
  ctx.fillStyle = '#2a1014'; ctx.fillRect(gx, gyy, gw, 5);
  let frac = clamp(G.gapShown / CONFIG.gap.max, 0, 1);
  if (hidden) frac = Math.random() * 0.8;
  const danger = G.danger > 0.6;
  ctx.fillStyle = hidden ? '#5a5a66' : danger ? ((G.frame & 8) ? '#ff3a3a' : '#a01f25') : '#cfd6ff';
  ctx.fillRect(gx, gyy, rnd(gw * frac), 5);
  ctx.fillStyle = '#ff3a1a'; ctx.fillRect(gx + 1, gyy + 2, 1, 1); ctx.fillRect(gx + 3, gyy + 2, 1, 1);
  ctx.drawImage(SPR.catIcon, gx + rnd(gw * frac) - 3, gyy + 7, SPR.catIcon.lw, SPR.catIcon.lh);
  if (hidden) textS('?', gx + gw + 6, gyy - 1, 'r', 1, 0);
  // stamina
  ctx.drawImage(SPR.bolt, 7, 19, SPR.bolt.lw, SPR.bolt.lh);
  ctx.fillStyle = '#000'; ctx.fillRect(gx - 1, 19, 62, 5);
  ctx.fillStyle = '#1b1810'; ctx.fillRect(gx, 20, 60, 3);
  ctx.fillStyle = cat.exhausted ? ((G.frame & 8) ? '#a0302a' : '#5a1a14') : '#d9b048';
  ctx.fillRect(gx, 20, rnd(60 * cat.stamina), 3);
  // dog player's panel (two-player mode)
  if (G.twoP) {
    const dx = 150;
    text('CAT: WASD', gx, 27, 'g', 1, 0);
    ctx.drawImage(SPR.dogIcon, dx, 5, SPR.dogIcon.lw, SPR.dogIcon.lh);
    text('DOG: ARROWS', dx + 11, 4, 'g', 1, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(dx - 1, 15, 62, 5);
    ctx.fillStyle = '#1b1010'; ctx.fillRect(dx, 16, 60, 3);
    ctx.fillStyle = dog.exhausted ? ((G.frame & 8) ? '#a0302a' : '#5a1a14') : '#e07a6a';
    ctx.fillRect(dx, 16, rnd(60 * dog.stam), 3);
    const ready = dog.pounceCD <= 0;
    ctx.drawImage(SPR.keys[A.UP][ready ? 1 : 0], dx + 76, 9, 10, 11);
    text(ready ? 'POUNCE' : 'POUNCE ' + Math.ceil(dog.pounceCD), dx + 89, 12, ready ? 'y' : 'g', 1, 0);
  }
  // clock
  textS(G.clockStr, W - 6, 5, G.dawn > 0.3 ? 'y' : 'w', 2, 2);
}

function qteRow(keys, idx, set, cxm, y, size) {
  const q = G.qte, gapx = size * 0.3, total = q.len * size + (q.len - 1) * gapx;
  let x = cxm - total / 2;
  for (let i = 0; i < q.len; i++) {
    const cur = i === idx, done = i < idx;
    if (done) ctx.globalAlpha = 0.3;
    const key = set[keys[i]][cur ? 1 : 0];
    const pop = cur && (G.time * 8 % 1) < 0.5 ? 2 : 0;
    ctx.drawImage(key, x - pop, y - pop, size + pop * 2, size * 1.07 + pop * 2);
    ctx.globalAlpha = 1;
    x += size + gapx;
  }
}
function drawQTE() {
  const q = G.qte;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 70, W, 84);
  const jx = (G.frame & 2) ? 1 : -1;
  textS('STRUGGLE!', W / 2 + jx, 78, 'r', 2, 1);
  if (!G.twoP) qteRow(q.keys, q.idx, SPR.keys, W / 2, 100, 28);
  else {
    text('CAT', W / 2 - 120, 96, 'b', 1, 1); qteRow(q.keys, q.idx, SPR.keysW, W / 2 - 120, 106, 22);
    text('DOG', W / 2 + 120, 96, 'r', 1, 1); qteRow(q.dkeys, q.didx, SPR.keys, W / 2 + 120, 106, 22);
    text('FIRST TO FINISH WINS', W / 2, 112, 'g', 1, 1);
  }
  const frac = clamp(q.timer / q.total, 0, 1);
  ctx.fillStyle = '#000'; ctx.fillRect(W / 2 - 81, 139, 162, 6);
  ctx.fillStyle = frac < 0.35 ? ((G.frame & 4) ? '#ff3a3a' : '#a01f25') : '#e0393a';
  ctx.fillRect(W / 2 - 80, 140, rnd(160 * frac), 4);
}

const CONTROLS_SOLO = [
  ['→ / D', 'RUN'], ['← / A', 'BRAKE'], ['↑ / W / SPACE', 'JUMP'], ['↓ / S', 'SLIDE'],
  ['SHIFT', 'SPRINT'], ['P / ESC', 'PAUSE'], ['M', 'MUTE'], ['F', 'FPS'], ['R', 'RESTART'],
];
const CONTROLS_DUO = [
  ['D', 'CAT: RUN'], ['A', 'CAT: BRAKE'], ['W / SPACE', 'CAT: JUMP'], ['S', 'CAT: SLIDE'], ['LEFT SHIFT', 'CAT: SPRINT'],
  ['→', 'DOG: RUN'], ['←', 'DOG: HOLD BACK'], ['↑', 'DOG: POUNCE'], ['RIGHT SHIFT OR /', 'DOG: CHARGE'], ['P  M  F  R', 'PAUSE MUTE FPS RESTART'],
];
function drawControls(y, duo) {
  const list = duo ? CONTROLS_DUO : CONTROLS_SOLO, half = duo ? 5 : 5;
  for (let i = 0; i < list.length; i++) {
    const col = i < half ? 0 : 1, row = col === 0 ? i : i - half;
    const x = col === 0 ? 70 : 262, yy = y + row * 10;
    text(list[i][0], x, yy, 'g', 1, 0); text(list[i][1], x + (duo ? 80 : 92), yy, 'w', 1, 0);
  }
}

function drawTitle() {
  // occasional eyes blinking open in the dark
  const e = G.titleEyes;
  if (e.life > 0) {
    const a = Math.min(1, e.t * 3) * Math.min(1, e.life * 3) * ((e.t % 1.3) < 1.18 ? 1 : 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * 0.9;
    ctx.drawImage(SPR.eyeGlow, e.x - 8, e.y - 8, SPR.eyeGlow.lw, SPR.eyeGlow.lh); ctx.drawImage(SPR.eyeGlow, e.x - 2, e.y - 8, SPR.eyeGlow.lw, SPR.eyeGlow.lh);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (a > 0.3) { ctx.fillStyle = '#ff7a50'; ctx.fillRect(e.x - 1, e.y, 2, 1); ctx.fillRect(e.x + 5, e.y, 2, 1); }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  const glitch = Math.random() < 0.04 ? randi(-3, 3) : 0;
  textS('NINE LIVES', W / 2 + glitch, 46, 'r', 5, 1);
  text('SURVIVE UNTIL DAWN', W / 2, 92, 'g', 1, 1);
  const opts = ['SOLO  -  YOU ARE THE CAT, THE NIGHT HUNTS YOU', 'TWO PLAYERS  -  CAT (WASD) VS DOG (ARROWS)'];
  for (let i = 0; i < 2; i++) {
    const sel = G.menuSel === i, y = 110 + i * 15;
    if (sel) { ctx.fillStyle = 'rgba(224,57,58,0.18)'; ctx.fillRect(W / 2 - 150, y - 3, 300, 13); }
    textS((sel ? '>  ' : '') + (i + 1) + '.  ' + opts[i] + (sel ? '  <' : ''), W / 2, y, sel ? 'y' : 'g', 1, 1);
  }
  const flick = (G.time % 1.1) < 0.75 && Math.random() > 0.04;
  if (flick) text('↑ ↓ TO CHOOSE   ·   ENTER OR SPACE TO START', W / 2, 143, 'w', 1, 1);
  drawControls(162, G.menuSel === 1);
  if (G.best > 0) text('SOLO BEST: ' + G.bestStr, W / 2, 222, 'y', 1, 1);
  text('3:00 AM. SOMETHING IS AWAKE.', W / 2, 250, 'g', 1, 1);
}

function drawEnd() {
  if (G.state === 'caught') {
    if (!G.endShown) return;
    textS('CAUGHT', W / 2 + ((G.frame & 4) && G.endT < 1.6 ? 1 : 0), 62, 'r', 6, 1);
    if (G.twoP) textS('THE DOG WINS', W / 2, 112, 'r', 2, 1);
    text((G.twoP ? 'THE CAT SURVIVED ' : 'YOU SURVIVED ') + G.survivedStr, W / 2, 134, 'w', 1, 1);
    text('THE CLOCK READ ' + G.endClockStr, W / 2, 147, 'g', 1, 1);
    if (!G.twoP) text((G.newBest ? 'NEW BEST: ' : 'BEST: ') + G.bestStr, W / 2, 160, 'y', 1, 1);
    if ((G.time % 1) < 0.7) textS('PRESS R TO TRY AGAIN', W / 2, 186, 'w', 2, 1);
    text('ESC FOR MENU', W / 2, 210, 'g', 1, 1);
  } else if (G.state === 'win' && G.endShown) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 50, W, 130);
    textS('SURVIVED', W / 2, 62, 'y', 6, 1);
    text('6:00 AM. THE SUN IS UP.', W / 2, 124, 'w', 1, 1);
    if (G.twoP) textS('THE CAT WINS', W / 2, 136, 'b', 1, 1);
    else {
      text('TIME SURVIVED ' + G.survivedStr, W / 2, 138, 'w', 1, 1);
      text((G.newBest ? 'NEW BEST: ' : 'BEST: ') + G.bestStr, W / 2, 152, 'y', 1, 1);
    }
    if ((G.time % 1) < 0.7) textS('PRESS R TO PLAY AGAIN   ·   ESC FOR MENU', W / 2, 166, 'w', 1, 1);
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
  textS('PAUSED', W / 2, 50, 'w', 4, 1);
  drawControls(110, G.twoP);
  text('P / ESC TO RESUME', W / 2, 190, 'y', 1, 1);
}

let fpsStr = '', fpsFrames = 0, fpsTime = 0;
function render() {
  promptsDrawnForState();
  if (G.state === 'caught' && G.blackout) { ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  else drawWorld();
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if (G.state === 'play') {
    drawPrompts(); drawPopups(); drawHUD();
    if (G.qte.active) drawQTE();
    if (G.runTextT >= 0 && G.runTextT < 1.2) drawRunText();
  } else if (G.state === 'intro') {
    if (G.runTextT >= 0) drawRunText();
  } else if (G.state === 'title') drawTitle();
  else if (G.state === 'win') { drawPopups(); drawHUD(); }
  drawEnd();
  if (G.flash > 0) { ctx.globalAlpha = Math.min(1, G.flash); ctx.fillStyle = '#e8e8ff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.fade > 0) { ctx.globalAlpha = Math.min(1, G.fade); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.paused) drawPause();
  if (G.muted) text('MUTED', W - 6, H - 11, 'g', 1, 2);
  if (G.showFps) textS(fpsStr, 6, H - 11, 'y', 1, 0);
}
function promptsDrawnForState() { if (G.state !== 'play') promptCount = 0; }
function drawRunText() {
  const t = G.runTextT;
  const scale = Math.max(8, 16 - Math.floor(t * 50));
  if (t > 0.9 && (G.frame & 2)) return;
  const jx = t < 0.3 ? randi(-2, 2) : 0;
  textS('RUN', W / 2 + jx, H / 2 - 3.5 * scale - 20, 'r', scale, 1);
}

// ==========================================================================
// 11. GAME STATES
// ==========================================================================
function setPaused(p) {
  if (p === G.paused) return;
  G.paused = p;
  if (p) Sound.suspend(); else Sound.resume();
}

function newRun(quick) {
  newWorld();
  G.state = 'intro'; G.paused = false; Sound.resume();
  G.t = 0; G.diff = 0; G.dawn = 0; G.qteCount = 0; G.clockMin = -1; updateClock();
  G.introT = quick ? 1.8 : 0; G.introT0 = G.introT; G.fade = 1; G.blackout = false; G.endShown = false; G.newBest = false;
  G.shake = 0; G.flash = 0; G.danger = 0; G.heartT = 0; G.runTextT = -1; G.qte.active = false; G.endT = 0;
  G.gapShown = CONFIG.gap.start;
  scheduleScares();
  Sound.setGrowl(0);
}

function startPlay() {
  G.state = 'play'; G.t = 0;
  cat.state = 'run'; cat.vx = 80;
  dog.state = 'chase'; dog.visible = true; dog.alpha = 1; dog.x = cat.x - 7 - CONFIG.gap.start;
}

function startCaught() {
  G.state = 'caught'; G.endT = 0; G.blackout = false; G.endShown = false;
  cat.state = 'caught'; dog.state = 'lunge';
  Sound.snarl(0.8); saveBest();
}
function startWin() {
  G.state = 'win'; G.endT = 0; G.endShown = false;
  saveBest();
  dog.state = 'retreat'; Sound.whimper(); Sound.setGrowl(0); Sound.birds();
  cat.auto = true; if (cat.state !== 'air') cat.state = 'run';
  const o = getObs();
  if (o) { spawnSegment('home', Math.max(cat.x + 300, G.camX + W + 10)); G.home = null;
    for (let i = 0; i < OBS.length; i++) if (OBS[i].active && OBS[i].type === 'home') G.home = OBS[i]; }
}

function updateTitle(dt) {
  G.camX += 12 * dt; G.dawn = 0;
  updateDecor(dt); updateParticles(dt);
  updateAtmos(dt, false);
  const e = G.titleEyes;
  if (e.life > 0) { e.t += dt; e.life -= dt; }
  else { e.next -= dt; if (e.next <= 0) { e.life = rand(1.5, 2.6); e.t = 0; e.next = rand(4, 8); e.x = randi(30, W - 40); e.y = randi(GY - 40, GY - 18); } }
  G.fade = Math.max(0, G.fade - dt);
  if (Input.hit[A.UP] && !Input.space || Input.hit[A.DOWN] || Input.hit[A.LEFT] || Input.hit[A.RIGHT]) { G.menuSel = 1 - G.menuSel; Sound.click(0.2); }
  if (Input.hit[A.ONE]) { G.menuSel = 0; G.twoP = false; newRun(false); }
  else if (Input.hit[A.TWO]) { G.menuSel = 1; G.twoP = true; newRun(false); }
  else if (Input.hit[A.CONFIRM] || Input.space) { G.twoP = G.menuSel === 1; newRun(false); }
}

function updateIntro(dt) {
  const prev = G.introT; G.introT += dt; const T = G.introT;
  const crossed = a => prev < a && T >= a;
  if (T > G.introT0 + 0.8 && T < 2.95 && (Input.hit[A.CONFIRM] || Input.hit[A.UP] || Input.hit[A.RIGHT])) G.introT = 2.95;
  G.fade = Math.max(0, 1 - (T - G.introT0) / 0.8);
  dog.eyesK = smooth(2.0, 2.5, T);
  if (crossed(0.5)) Sound.gust();
  if (crossed(2.0)) Sound.snarl(0.3);
  if (crossed(3.0)) { dog.x = cat.x - 7 - CONFIG.gap.start; Sound.bark(0.8, true); G.shake = 0.6; dog.eyesK = 1; }
  if (crossed(3.4)) { G.runTextT = 0; cat.state = 'alert'; Sound.hiss(0.4); Sound.thud(0.8); G.flash = 0.35; G.shake = 1; }
  if (G.runTextT >= 0) G.runTextT += dt;
  if (T >= 3.0) dog.eyesK = 1;
  updateDecor(dt); updateParticles(dt);
  updateAtmos(dt, false);
  if (G.introT >= 4.5) startPlay();
}

function updatePlay(rawDt) {
  promptCount = 0;
  let ts = 1;
  if (G.qte.active) ts = CONFIG.qte.slowmo;
  else if (G.scare.phase === 3) ts = CONFIG.scare.slowmo;
  const dt = rawDt * ts;
  G.t += dt; G.diff = clamp(G.t / CONFIG.runLength, 0, 1);
  G.dawn = smooth(CONFIG.dawnStart, CONFIG.runLength + 4, G.t);
  if (G.runTextT >= 0) G.runTextT += rawDt;
  if (G.qte.active) updateQTE(rawDt);
  if (G.state !== 'play') return;           // QTE failed this step
  updateCat(dt);
  updateObstacles(dt);
  updateDog(dt);
  updateScare(dt, rawDt);
  updateSpawner();
  updateDecor(dt);
  updateParticles(dt);
  updatePopups(rawDt);
  updateCamera(dt);
  updateAtmos(rawDt, true);
  updateClock();
  if (dog.state !== 'hidden') G.gapShown += (gap() - G.gapShown) * Math.min(1, rawDt * 6);
  if (G.t >= CONFIG.runLength && !G.qte.active && (cat.state === 'run' || cat.state === 'slide' || cat.state === 'stumble')) startWin();
}

function updateCaught(dt) {
  G.endT += dt;
  if (!G.blackout) {
    dog.x += 140 * dt; dog.hopH = Math.sin(clamp(G.endT / 0.35, 0, 1) * Math.PI) * 18;
    G.shake = Math.max(G.shake, 0.8);
    if (G.endT >= 0.35) { G.blackout = true; Sound.bark(1, false); Sound.thud(1); Sound.setGrowl(0); }
  }
  if (G.endT >= 1.1 && !G.endShown) G.endShown = true;
  G.shake = Math.max(0, G.shake - dt * 1.8);
  G.danger = Math.max(0, G.danger - dt);
  updateParticles(dt);
}

function updateWin(dt) {
  G.endT += dt;
  G.t += dt; G.dawn = smooth(CONFIG.dawnStart, CONFIG.runLength + 4, G.t);
  promptCount = 0;
  if (cat.state === 'flap') {
    cat.flapT += dt;
    if (cat.flapT > 0.4) cat.visible = false;
    if (cat.flapT > 1.2 && !G.endShown) { G.endShown = true; Sound.chord(); }
  } else {
    updateCat(dt);
    if (G.home && cat.x >= G.home.x + SPR.homeFlapX && cat.h < 1) { cat.state = 'flap'; cat.flapT = 0; cat.vx = 0; Sound.thud(0.25); Sound.click(0.3); }
  }
  updateObstacles(dt);
  updateDog(dt);
  updateDecor(dt); updateParticles(dt); updatePopups(dt); updateCamera(dt);
  updateAtmos(dt, false);
  G.danger = Math.max(0, G.danger - dt);
}

function update(dt) {
  G.time += dt; G.frame++;
  setControlMaps();
  switch (G.state) {
    case 'title': updateTitle(dt); break;
    case 'intro': updateIntro(dt); break;
    case 'play': updatePlay(dt); break;
    case 'caught': updateCaught(dt); break;
    case 'win': updateWin(dt); break;
  }
}

// keys that work in every state (handled once per rendered frame)
function handleMeta() {
  if (Input.hit[A.MUTE]) { G.muted = !G.muted; Sound.setMuted(G.muted); }
  if (Input.hit[A.FPS]) G.showFps = !G.showFps;
  if (Input.hit[A.PAUSE]) {
    Input.hit[A.PAUSE] = 0;
    if (G.state === 'play' || G.state === 'intro') setPaused(!G.paused);
    else if ((G.state === 'caught' || G.state === 'win') && G.endShown) { newWorld(); G.state = 'title'; G.fade = 1; Sound.setGrowl(0); }
  }
  if (Input.hit[A.RESTART] && G.state !== 'title') { Input.hit[A.RESTART] = 0; G.paused = false; newRun(true); }
  if (G.paused) Input.clearHits();
}

// ==========================================================================
// 12. MAIN LOOP — fixed 60 Hz update, dt capped at 50 ms
// ==========================================================================
const STEP = 1 / 60;
let lastTime = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastTime) / 1000; lastTime = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5) { fpsStr = Math.round(fpsFrames / fpsTime) + ' FPS'; fpsFrames = 0; fpsTime = 0; }
  handleMeta();
  if (!G.paused) {
    acc += dt;
    while (acc >= STEP) { update(STEP); Input.clearHits(); acc -= STEP; }
    // the meta keys were consumed above; keep the rest for the next step if none ran
  } else acc = 0;
  if (Input.hit[A.MUTE] || Input.hit[A.FPS]) { Input.hit[A.MUTE] = 0; Input.hit[A.FPS] = 0; }
  render();
}

buildAll();
newWorld();
G.state = 'title'; G.fade = 1;
window.__NL = { G, cat, dog, CONFIG, OBS, startLunge, startWin };   // handy for tinkering in the console
requestAnimationFrame(frame);
</script>
