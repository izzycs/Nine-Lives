               right: calc(env(safe-area-inset-right, 0px) + clamp(64px, 20vmin, 96px) + 34px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }

                 border-radius: 8px; padding: 12px 18px; min-width: 104px; touch-action: manipulation; outline: none; -webkit-user-select: none; user-select: none; }
  #menu button.big { font-size: 19px; padding: 14px 40px; border-color: rgba(243,198,79,0.8); color: #f3c64f; }

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA <script>
'use strict';
/* ==========================================================================
   NINE LIVES — a top-down horror chase through a haunted house.
   You are a cat. Something huge is loose in the house. Survive from
   3:00 AM until dawn. Solo against the dog, or two players on one keyboard.

   Sections:
     1. CONFIG            all tuning values
     2. UTIL              math helpers
     3. CANVAS            the single game canvas + letterboxing
     4. INPUT             keyboard state, edge-triggered "hits", per-player maps
     5. AUDIO             Web Audio synth: drone, wind, growl, heartbeat, sfx
     6. THE HOUSE         tile map, rooms, doors, vents, furniture, lights
     7. ART               world, furniture, lightmap and sprites, baked once
     8. VISIBILITY        tile raycasts: line of sight polygons, flow fields
     9. ENTITIES          cat, dog, vases, particles, ripples (all pooled)
    10. GAMEPLAY          cat, dog AI, hiding, noise, scent, scares, struggle
    11. RENDERING         views (split screen in 2P), darkness, HUD, screens
    12. GAME STATES       title, intro, play, caught, win
    13. MAIN LOOP         fixed 60 Hz timestep
   ========================================================================== */

// ==========================================================================
// 1. CONFIG
// ==========================================================================
const CONFIG = {
  W: 480, H: 270,            // logical view in world units
  RES: 2,                    // backing-store pixels per world unit (960x540 canvas)
  TILE: 16,
  runLength: 180,            // seconds from 3:00 AM to 6:00 AM
  dawnStart: 158,
  particlesMax: 150,
  rays: 360,                 // line-of-sight rays per view
  losRadius: 250,
  losRadius2P: 190,
  wallPeek: 5,               // how far light spills onto wall tops (world units)

  cat: {
    walk: 64, sprint: 104, accel: 14, half: 3.5,
    crawl: 0.62,             // speed factor under furniture / in vents
    dashSpeed: 235, dashTime: 0.17, dashCooldown: 1.4,
    stamDrain: 0.38, stamRegen: 0.24, exhaustedUntil: 0.35,
    nerveDrain: 0.24, nerveRegen: 0.16, nerveRange: 72,
    invuln: 1.4, sightRadius: 150,
  },
  dog: {
    half: 5.5, catchDist: 11,
    wander: 44, huntStart: 72, huntEnd: 96, searchFactor: 0.8, farBoost: 1.18,
    sightLit: 230, sightDark: 100, sightStill: 52, smell: 26, fov: 0.45, closeSense: 34,
    memory: 0.9, searchTime: 7, repath: 0.25,
    pounceMin: 24, pounceMax: 66, pounceWindup: 0.34, pounceSpeed: 250, pounceTime: 0.22,
    pounceCooldown: 3.2, recover: 0.45,
    stun: 1.4, vaseStunRange: 38, vaseStun: 1.6, scentLife: 14,
  },
  dogPlayer: { speed: 84, charge: 114, drain: 0.45, regen: 0.2, pounceWindup: 0.14, pounceCooldown: 2.8, sight: 175 },
  noise: { walk: 40, sprint: 130, dash: 95, vase: 280, creak: 150, piano: 230 },
  qte: { keysEasy: 3, keysHard: 4, timeEasy: 2.6, timeHard: 1.6, minTime: 1.3, perUseCut: 0.12, slowmo: 0.12, push: 30 },
  scare: { times: [50, 116], dodgeWindow: 0.6, slowmo: 0.3, triggerDist: 40, wait: 24, relocate: 7, minDist: 90, maxDist: 320 },
  // solo: when you have shaken it off, it vanishes and reappears right behind you (Jason rules)
  blink: { grace: 14, cdStart: 24, cdEnd: 13, lostTime: 2.6, minDist: 130, distMin: 62, distMax: 96, fade: 0.75, appear: 0.3 },
  lightning: { min: 12, max: 28 },
  ghost: { min: 28, max: 55 },
};

// ==========================================================================
// 2. UTIL
// ==========================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
function angLerp(a, b, k) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return a + d * k; }
function fmtTime(s) { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function clockMins(t) { return Math.min(180, Math.floor(t * 180 / CONFIG.runLength)); }
function fmtClock(t) { const mins = clockMins(t), h = 3 + Math.floor(mins / 60), m = mins % 60; return h + ':' + (m < 10 ? '0' : '') + m + ' AM'; }

// ==========================================================================
// 3. CANVAS
// ==========================================================================
const W = CONFIG.W, H = CONFIG.H, RES = CONFIG.RES, T = CONFIG.TILE;
// The game thinks in a 480x270 view; the backing store is RES times that so the
// art can be smooth and shaded. Never tied to devicePixelRatio.
const canvas = document.getElementById('game');
canvas.width = W * RES; canvas.height = H * RES;
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = true;

// The viewport can change under us on phones (address bar, rotation), so the canvas is
// refit on every signal we can get; the DOM overlay reads the result through CSS vars.
let viewW = 0, viewH = 0, touchReady = false;
function fitCanvas() {
  const vv = window.visualViewport;
  viewW = Math.round(vv ? vv.width : window.innerWidth) || window.innerWidth;
  viewH = Math.round(vv ? vv.height : window.innerHeight) || window.innerHeight;
  const s = Math.min(viewW / W, viewH / H), cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  const st = document.documentElement.style;
  st.setProperty('--gs', s.toFixed(4));
  st.setProperty('--gx', Math.floor((viewW - cw) / 2) + 'px');
  st.setProperty('--gy', Math.floor((viewH - ch) / 2) + 'px');
  if (touchReady) TouchUI.layout();
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => { fitCanvas(); setTimeout(fitCanvas, 120); setTimeout(fitCanvas, 500); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
fitCanvas();

// Offscreen canvas in world units: backing store is RES× larger, context pre-scaled.
function mk(w, h, res) {
  const r = res || RES, c = document.createElement('canvas');
  c.width = Math.ceil(w * r); c.height = Math.ceil(h * r); c.lw = w; c.lh = h;
  c.getContext('2d').setTransform(r, 0, 0, r, 0, 0);
  return c;
}

// ==========================================================================
// 4. INPUT
//    Solo: the cat answers to arrows AND WASD. Two players: the cat is WASD +
//    Left Shift + Space, the dog is the arrows + Right Shift + / (or Enter).
// ==========================================================================
const A = { RIGHT: 0, LEFT: 1, UP: 2, DOWN: 3, SPRINT: 4, DASH: 5, PAUSE: 6, MUTE: 7, FPS: 8, RESTART: 9, CONFIRM: 10, ONE: 11, TWO: 12 };
const KEYMAP = {
  ArrowRight: 0, KeyD: 0, ArrowLeft: 1, KeyA: 1, ArrowUp: 2, KeyW: 2, ArrowDown: 3, KeyS: 3,
  ShiftLeft: 4, ShiftRight: 4, Space: 5, KeyP: 6, Escape: 6, KeyM: 7, KeyF: 8, KeyR: 9,
  Enter: 10, NumpadEnter: 10, Digit1: 11, Digit2: 12, Numpad1: 11, Numpad2: 12,
};
const P1KEYS = { KeyD: 0, KeyA: 1, KeyW: 2, KeyS: 3, ShiftLeft: 4, Space: 5 };
const P2KEYS = { ArrowRight: 0, ArrowLeft: 1, ArrowUp: 2, ArrowDown: 3, ShiftRight: 4, Slash: 5, Enter: 5, NumpadEnter: 5, ControlRight: 5, Numpad0: 5 };
const ARROW_GLYPH = ['→', '←', '↑', '↓'];
const WASD_GLYPH = ['D', 'A', 'W', 'S'];
const Input = {
  held: new Uint8Array(13), hit: new Uint8Array(13),       // everything (solo + menus): keyboard OR touch
  kb: new Uint8Array(13),                                  // keyboard-only held state (merged into `held`)
  p1held: new Uint8Array(6), p1hit: new Uint8Array(6),     // WASD side
  p2held: new Uint8Array(6), p2hit: new Uint8Array(6),     // arrow side
  any: false,
  clearHits() { this.hit.fill(0); this.p1hit.fill(0); this.p2hit.fill(0); this.any = false; },
  releaseAll() { this.held.fill(0); this.kb.fill(0); this.p1held.fill(0); this.p2held.fill(0); if (touchReady) TouchUI.release(); },
  merge(a) { this.held[a] = (this.kb[a] | TouchUI.held[a]) ? 1 : 0; },
};
// the cat's and the dog's key arrays for the current mode (set every update)
let CH = Input.held, CT = Input.hit, DH = Input.p2held, DT = Input.p2hit;
function setControlMaps() {
  if (G.twoP) { CH = Input.p1held; CT = Input.p1hit; } else { CH = Input.held; CT = Input.hit; }
  DH = Input.p2held; DT = Input.p2hit;
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey && e.code !== 'ControlRight' || e.altKey) return;   // leave browser shortcuts alone
  const a = KEYMAP[e.code];
  if ((a !== undefined && a <= A.DASH) || e.code === 'Slash' || e.code === 'Enter') e.preventDefault();
  Sound.unlock();                                       // Chrome autoplay: start audio on first key
  if (e.repeat) return;
  if (TouchUI.on && a !== undefined) TouchUI.set(false);    // a keyboard showed up: hide the thumb controls
  if (a !== undefined) { Input.kb[a] = 1; Input.held[a] = 1; Input.hit[a] = 1; }
  const p1 = P1KEYS[e.code], p2 = P2KEYS[e.code];
  if (p1 !== undefined) { Input.p1held[p1] = 1; Input.p1hit[p1] = 1; }
  if (p2 !== undefined) { Input.p2held[p2] = 1; Input.p2hit[p2] = 1; }
  Input.any = true;
});
window.addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (a !== undefined) { Input.kb[a] = 0; Input.merge(a); }
  const p1 = P1KEYS[e.code], p2 = P2KEYS[e.code];
  if (p1 !== undefined) Input.p1held[p1] = 0;
  if (p2 !== undefined) Input.p2held[p2] = 0;
});
window.addEventListener('blur', () => {
  Input.releaseAll();
  if (G.state === 'play' || G.state === 'intro') setPaused(true);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G.state === 'play' || G.state === 'intro') setPaused(true);
    Sound.suspend();
  } else {
    if (!G.paused) Sound.resume();
    lastTime = performance.now();
  }
});

// ==========================================================================
// 4b. TOUCH — phones and tablets. A floating stick under the left thumb, SPRINT
//     (hold) and DASH (tap) under the right, a pause button, and swipes for the
//     struggle. Menus become real buttons. Everything feeds the same Input arrays
//     the keyboard uses, so the game logic does not know the difference.
// ==========================================================================
const TouchUI = (() => {
  const ui = document.getElementById('ui'), menu = document.getElementById('menu'), rotate = document.getElementById('rotate');
  const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
  const bSprint = document.getElementById('btnSprint'), bDash = document.getElementById('btnDash'), bPause = document.getElementById('btnPause');
  const STICK_R = 46, DEAD = 0.2, SWIPE = 26;             // css px / fraction / css px
  const TU = {
    on: false, portrait: false,
    held: new Uint8Array(13),
    stick: { id: -1, on: false, x: 0, y: 0, ox: 0, oy: 0 },   // x,y: analog, unit circle
    ptrs: new Map(),                                           // pointerId -> { kind, x0, y0, done }
    mode: '', menuKey: '',
  };
  const canFS = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const press = a => { Input.hit[a] = 1; Input.any = true; };
  const hold = (a, v) => { TU.held[a] = v ? 1 : 0; Input.merge(a); };
  const setDirs = (x, y) => { hold(A.RIGHT, x > 0.35); hold(A.LEFT, x < -0.35); hold(A.DOWN, y > 0.35); hold(A.UP, y < -0.35); };

  function set(v) {
    if (v === TU.on) return;
    TU.on = v; ui.hidden = !v; TU.menuKey = '';
    if (!v) release();
    layout(); sync();
  }
  function release() {
    TU.ptrs.clear(); TU.stick.on = false; TU.stick.id = -1; TU.stick.x = TU.stick.y = 0;
    stickEl.classList.remove('on'); bSprint.classList.remove('down'); bDash.classList.remove('down');
    for (let a = 0; a <= A.DASH; a++) hold(a, false);
  }
  function layout() {
    const p = viewH > viewW * 1.05;
    if (p !== TU.portrait) { TU.portrait = p; TU.menuKey = ''; }
    rotate.classList.toggle('on', TU.on && p);
    if (TU.on && p && (G.state === 'play' || G.state === 'intro')) setPaused(true);
  }

  // ---- the stick ----
  function stickStart(e) {
    const s = TU.stick; s.id = e.pointerId; s.on = true; s.ox = e.clientX; s.oy = e.clientY; s.x = s.y = 0;
    stickEl.style.transform = 'translate(' + s.ox + 'px,' + s.oy + 'px)'; knob.style.transform = ''; stickEl.classList.add('on');
  }
  function stickMove(e) {
    const s = TU.stick; let dx = e.clientX - s.ox, dy = e.clientY - s.oy, L = Math.hypot(dx, dy);
    if (L > STICK_R) {                                  // the base follows a thumb that slides away
      const k = (L - STICK_R) / L; s.ox += dx * k; s.oy += dy * k; dx -= dx * k; dy -= dy * k; L = STICK_R;
      stickEl.style.transform = 'translate(' + s.ox + 'px,' + s.oy + 'px)';
    }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    const mag = L / STICK_R;
    if (mag < DEAD) { s.x = s.y = 0; } else { const k = ((mag - DEAD) / (1 - DEAD)) / L; s.x = dx * k; s.y = dy * k; }
    setDirs(s.x, s.y);
  }
  function stickEnd() { TU.stick.on = false; TU.stick.id = -1; TU.stick.x = TU.stick.y = 0; stickEl.classList.remove('on'); setDirs(0, 0); }

  // ---- pointer routing ----
  function down(e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (G.paused) return;
    if (G.state === 'intro') { press(A.CONFIRM); return; }       // a tap skips the opening
    if (G.state !== 'play') return;
    if (G.qte.active) { TU.ptrs.set(e.pointerId, { kind: 'swipe', x0: e.clientX, y0: e.clientY, done: false }); return; }
    if (!TU.stick.on && e.clientX < viewW * 0.62) { TU.ptrs.set(e.pointerId, { kind: 'stick' }); stickStart(e); }
  }
  function move(e) {
    const p = TU.ptrs.get(e.pointerId); if (!p) return;
    if (p.kind === 'stick') {
      if (G.qte.active) { stickEnd(); p.kind = 'swipe'; p.x0 = e.clientX; p.y0 = e.clientY; p.done = false; return; }
      stickMove(e); return;
    }

function buildMap() {
  MAP.fill(TW); ROOMOF.fill(-1);
  ROOMS.forEach((r, i) => { for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) { MAP[tIdx(x, y)] = TF; ROOMOF[tIdx(x, y)] = i; } });
  for (const d of DOORS) for (let y = d[1]; y <= d[3]; y++) for (let x = d[0]; x <= d[2]; x++) MAP[tIdx(x, y)] = d[4];
  for (const f of FURN) {
    if (f[5] < 0) continue;
    for (let y = f[2]; y < f[2] + f[4]; y++) for (let x = f[1]; x < f[1] + f[3]; x++) { MAP[tIdx(x, y)] = f[5]; ISFURN[tIdx(x, y)] = 1; }
  }
  MAP[tIdx(5, 33)] = TU;                // the vent from the dining room opens into a kitchen cupboard
  srand(4242);
  for (let i = 0; i < MW * MH; i++) {
    const r = ROOMOF[i];
    if (MAP[i] === TF && r >= 0 && /oak|plank|pale|parquet/.test(ROOMS[r].floor) && sr(0, 1) < 0.06) CREAK[i] = 1;
  }
}

const SPR = {};

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shadeHex(h, k) { const c = hexRgb(h); return 'rgb(' + clamp(Math.round(c[0] * k), 0, 255) + ',' + clamp(Math.round(c[1] * k), 0, 255) + ',' + clamp(Math.round(c[2] * k), 0, 255) + ')'; }
function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.1), Math.max(ry, 0.1), rot || 0, 0, TAU); g.fill(); }
function poly(g, p) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); g.fill(); }
function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); g.fill();
}
function line(g, x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(r, 0.1), 0, TAU); g.fill(); }

// Deterministic random for textures
let seedV = 1;
function srand(seed) { seedV = seed >>> 0 || 1; }
function sr(a, b) { seedV = (seedV * 1664525 + 1013904223) >>> 0; return a + (seedV / 4294967296) * (b - a); }
function pick(arr) { return arr[Math.floor(sr(0, arr.length))]; }

function grainOn(c, col, n, alpha, seed) {
  const g = c.getContext('2d'); srand(seed || 3);
  g.save(); g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.globalAlpha = alpha;
  for (let i = 0; i < n; i++) g.fillRect(sr(0, c.lw), sr(0, c.lh), sr(0.3, 1.1), sr(0.3, 0.9));
  g.restore();
}
function furOn(c, col, n, len, alpha, seed) {
  const g = c.getContext('2d'); srand(seed || 7);
  g.save(); g.globalCompositeOperation = 'source-atop'; g.strokeStyle = col; g.globalAlpha = alpha; g.lineWidth = 0.4; g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = sr(0, c.lw), y = sr(0, c.lh), a = Math.PI + sr(-0.45, 0.45);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  g.restore();
}
function shineOn(c, x, y, r, col) {
  const g = c.getContext('2d'); g.save(); g.globalCompositeOperation = 'source-atop';
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}
function radial(size, stops, res) {
  const c = mk(size, size, res), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let i = 0; i < stops.length; i += 2) gr.addColorStop(stops[i], stops[i + 1]);
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}

// ---------- text (canvas fonts; sizes are in world units, 8px per "scale") ----------
const FONT_COLORS = { w: '#ece6da', r: '#e0393a', y: '#f3c64f', g: '#8d8a95', k: 'rgba(0,0,0,0.85)', d: '#1b1612', b: '#9fc4ff', o: '#ff8a3a' };
const FONTS = [];
for (let s = 1; s <= 16; s++) FONTS[s] = s >= 3 ? 'bold ' + 8 * s + 'px Georgia, "Times New Roman", serif' : (s === 2 ? 'bold ' : '') + 8 * s + 'px "Trebuchet MS", "Helvetica Neue", Arial, sans-serif';
function text(str, x, y, col, scale, align) {
  ctx.font = FONTS[scale || 1];
  ctx.textAlign = align === 1 ? 'center' : align === 2 ? 'right' : 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = FONT_COLORS[col || 'w'];
  ctx.fillText(str, x, y);
}
function textS(str, x, y, col, scale, align) { const o = Math.max(0.75, (scale || 1) * 0.5); text(str, x + o, y + o, 'k', scale, align); text(str, x, y, col, scale, align); }

// ---------- floors ----------
function planks(g, x, y, w, h, ph, cols, seed) {
  srand(seed);
  for (let yy = y; yy < y + h; yy += ph) {
    let xx = x - sr(0, 40);
    while (xx < x + w) {
      const len = sr(26, 64), c = pick(cols);
      g.fillStyle = c; g.fillRect(Math.max(x, xx), yy, Math.min(len, x + w - Math.max(x, xx)), ph);
      g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(xx + len - 0.4, yy, 0.5, ph);
      g.globalAlpha = 0.12; g.fillStyle = '#000';
      for (let k = 0; k < 2; k++) g.fillRect(Math.max(x, xx + sr(0, len * 0.4)), yy + sr(0.6, ph - 0.6), sr(8, len * 0.8), 0.3);
      g.globalAlpha = 1;
      if (sr(0, 1) < 0.15) { g.fillStyle = 'rgba(0,0,0,0.35)'; circ(g, xx + sr(4, len - 4), yy + ph / 2, 0.5); }
      xx += len;
    }
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x, yy + ph - 0.35, w, 0.35);
  }
}
function drawFloor(g, r, seed) {
  const x = r.x0 * T, y = r.y0 * T, w = (r.x1 - r.x0 + 1) * T, h = (r.y1 - r.y0 + 1) * T;
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  srand(seed);
  switch (r.floor) {
    case 'oak': planks(g, x, y, w, h, 4, ['#4a3020', '#53361f', '#432b1c', '#4f3423', '#3e281a'], seed); break;
    case 'plank': planks(g, x, y, w, h, 5, ['#5a4030', '#634632', '#523a2b', '#5d4433'], seed); break;
    case 'pale': planks(g, x, y, w, h, 5, ['#7a6a58', '#837261', '#706150', '#7d6c5a'], seed); break;
    case 'parquet': {
      const cols = ['#5a3a22', '#64432a', '#4e321e', '#5f3e25'];
      for (let yy = y; yy < y + h; yy += 8) for (let xx = x; xx < x + w; xx += 8) {
        const vert = ((xx - x) / 8 + (yy - y) / 8) % 2 === 0;
        for (let k = 0; k < 4; k++) {
          g.fillStyle = pick(cols);
          if (vert) g.fillRect(xx + k * 2, yy, 1.85, 7.85); else g.fillRect(xx, yy + k * 2, 7.85, 1.85);
        }
      }
      break;
    }
    case 'marble': {
      for (let yy = y, i = 0; yy < y + h; yy += 16, i++) for (let xx = x, j = 0; xx < x + w; xx += 16, j++) {
        const light = (i + j) % 2 === 0;
        g.fillStyle = light ? pick(['#a9a397', '#a29c90', '#aea89c']) : pick(['#1d1b20', '#232026', '#1a181c']);
        g.fillRect(xx, yy, 15.6, 15.6);
        g.strokeStyle = light ? 'rgba(90,80,70,0.35)' : 'rgba(200,200,210,0.12)'; g.lineWidth = 0.35;
        g.beginPath(); let vx = xx + sr(0, 16), vy = yy; g.moveTo(vx, vy);
        for (let k = 0; k < 5; k++) { vx += sr(-4, 4); vy += 3.3; g.lineTo(vx, vy); } g.stroke();
      }
      g.fillStyle = 'rgba(0,0,0,0.6)';
      for (let xx = x; xx < x + w; xx += 16) g.fillRect(xx - 0.2, y, 0.4, h);
      for (let yy = y; yy < y + h; yy += 16) g.fillRect(x, yy - 0.2, w, 0.4);
      break;
    }
    case 'checker': {
      for (let yy = y, i = 0; yy < y + h; yy += 8, i++) for (let xx = x, j = 0; xx < x + w; xx += 8, j++) {
        g.fillStyle = (i + j) % 2 ? pick(['#2f2a26', '#36302b']) : pick(['#b5ab92', '#aaa088', '#b9b098']);
        g.fillRect(xx, yy, 7.7, 7.7);
      }
      break;
    }
    case 'stone': {
      for (let yy = y, i = 0; yy < y + h; yy += 12, i++) {
        let xx = x - (i % 2) * 9;
        while (xx < x + w) { const sw = sr(14, 22);
          g.fillStyle = pick(['#55574f', '#4c4e47', '#5b5c54', '#474a44', '#525a4c']);
          rrect(g, xx + 0.5, yy + 0.5, sw - 1, 11, 1.5);
          if (sr(0, 1) < 0.25) { g.fillStyle = 'rgba(70,95,50,0.35)'; ell(g, xx + sr(2, sw - 2), yy + sr(2, 10), sr(1.5, 4), sr(1, 2.5)); }
          xx += sw; }
      }
      break;
    }
    case 'tile': {
      g.fillStyle = '#4e5755'; g.fillRect(x, y, w, h);
      for (let yy = y; yy < y + h; yy += 6) for (let xx = x; xx < x + w; xx += 6) {
        g.fillStyle = pick(['#a3aeaa', '#9ba6a2', '#a9b3ae', '#929d99']); g.fillRect(xx + 0.4, yy + 0.4, 5.2, 5.2);
      }
      break;
    }
  }
  // dust and grime toward the edges of the room
  for (let i = 0; i < w * h / 90; i++) { g.fillStyle = 'rgba(0,0,0,' + sr(0.03, 0.12) + ')'; ell(g, x + sr(0, w), y + sr(0, h), sr(2, 9), sr(1, 5), sr(0, 3)); }
  g.restore();
}
function drawRug(g, rx, ry, rw, rh, base, trim, seed) {
  const x = rx * T + 3, y = ry * T + 3, w = rw * T - 6, h = rh * T - 6;
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x + 1, y + 1.5, w, h);
  g.fillStyle = base; g.fillRect(x, y, w, h);
  g.strokeStyle = trim; g.lineWidth = 1.2; g.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
  g.lineWidth = 0.5; g.strokeRect(x + 5, y + 5, w - 10, h - 10);
  srand(seed);
  g.globalAlpha = 0.35; g.fillStyle = trim;
  for (let yy = y + 9; yy < y + h - 9; yy += 7) for (let xx = x + 9; xx < x + w - 9; xx += 7) {
    if ((Math.round((xx - x) / 7) + Math.round((yy - y) / 7)) % 2) poly(g, [xx, yy - 2, xx + 2, yy, xx, yy + 2, xx - 2, yy]);
  }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(220,200,160,0.4)';                         // fringe
  for (let xx = x; xx < x + w; xx += 1.5) { g.fillRect(xx, y - 1.5, 0.5, 1.5); g.fillRect(xx, y + h, 0.5, 1.5); }
  for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(0,0,0,' + sr(0.05, 0.18) + ')'; ell(g, x + sr(0, w), y + sr(0, h), sr(2, 7), sr(1, 4)); }
}

// ---------- walls ----------
const FACE = 9;     // height of the visible wall face drawn on the floor tile below a wall
function wallTile(g, tx, ty) {
  const x = tx * T, y = ty * T;
  g.fillStyle = '#100d11'; g.fillRect(x, y, T, T);
  srand(tx * 131 + ty * 977);
  for (let i = 0; i < 4; i++) { g.fillStyle = 'rgba(255,255,255,' + sr(0.01, 0.035) + ')'; g.fillRect(x + sr(0, 14), y + sr(0, 14), sr(1, 4), sr(1, 3)); }
  const solid = (a, b) => a < 0 || b < 0 || a >= MW || b >= MH || MAP[tIdx(a, b)] === TW || MAP[tIdx(a, b)] === TV;
  g.fillStyle = '#2b242a';                                           // cap where the wall meets a room
  if (!solid(tx, ty - 1)) g.fillRect(x, y, T, 1.2);
  if (!solid(tx, ty + 1)) g.fillRect(x, y + T - 1.2, T, 1.2);
  if (!solid(tx - 1, ty)) g.fillRect(x, y, 1.2, T);
  if (!solid(tx + 1, ty)) g.fillRect(x + T - 1.2, y, 1.2, T);
}
function wallFace(g, tx, ty, room) {
  // the face of the wall at (tx, ty) seen from the south, painted onto the tile below
  const x = tx * T, y = (ty + 1) * T, R = ROOMS[room] || ROOMS[4];
  g.fillStyle = R.paper; g.fillRect(x, y, T, FACE);
  g.fillStyle = R.paper2; for (let k = 0; k < 4; k++) g.fillRect(x + k * 4 + 1.5, y, 1, FACE - 2);
  g.fillStyle = 'rgba(210,180,110,0.12)'; for (let k = 0; k < 2; k++) poly(g, [x + 4 + k * 8, y + 2, x + 5.5 + k * 8, y + 3.5, x + 4 + k * 8, y + 5, x + 2.5 + k * 8, y + 3.5]);
  g.fillStyle = '#1a1210'; g.fillRect(x, y + FACE - 2.2, T, 2.2);
  g.fillStyle = 'rgba(255,230,200,0.08)'; g.fillRect(x, y, T, 0.8);
  const gr = g.createLinearGradient(0, y + FACE, 0, y + FACE + 6); gr.addColorStop(0, 'rgba(0,0,0,0.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(x, y + FACE, T, 6);
}
function windowArt(g, wx, wy, len, side) {
  for (let k = 0; k < len; k++) {
    const tx = side < 2 ? wx + k : wx, ty = side < 2 ? wy : wy + k, x = tx * T, y = ty * T;
    g.fillStyle = '#1a2436'; g.fillRect(x, y + (side === 0 ? 0 : 3), T, side === 0 ? T : 10);
    if (side >= 2) { g.fillStyle = '#1a2436'; g.fillRect(x + 3, y, 10, T); }
    g.fillStyle = 'rgba(160,190,255,0.25)'; g.fillRect(x + 2, y + 2, 5, 5); g.fillRect(x + 9, y + 9, 5, 5);
    g.fillStyle = '#2a2026'; g.fillRect(x + 7.4, y, 1.2, T); g.fillRect(x, y + 7.4, T, 1.2);
    if (side === 0) {                         // a tall window face below a north wall, with curtains
      const fy = y + T;
      g.fillStyle = '#16203a'; g.fillRect(x, fy, T, FACE);
      g.fillStyle = 'rgba(170,200,255,0.35)'; g.fillRect(x + 1.5, fy + 1, 5.5, FACE - 3); g.fillRect(x + 9, fy + 1, 5.5, FACE - 3);
      g.fillStyle = '#2a2026'; g.fillRect(x + 7, fy, 2, FACE);
    }
  }
  // tattered curtains on the room side
  g.fillStyle = 'rgba(90,30,40,0.85)';
  if (side === 0) { g.fillRect(wx * T - 3, (wy + 1) * T, 5, FACE + 3); g.fillRect((wx + len) * T - 2, (wy + 1) * T, 5, FACE + 3); }
  if (side === 1) { g.fillRect(wx * T - 3, wy * T - 3, 5, 4); g.fillRect((wx + len) * T - 2, wy * T - 3, 5, 4); }
  if (side === 2) { g.fillRect((wx + 1) * T - 1, wy * T - 3, 4, 5); g.fillRect((wx + 1) * T - 1, (wy + len) * T - 2, 4, 5); }
  if (side === 3) { g.fillRect(wx * T - 3, wy * T - 3, 4, 5); g.fillRect(wx * T - 3, (wy + len) * T - 2, 4, 5); }
}
function ventArt(g, tx, ty) {
  const x = tx * T, y = ty * T, vertWall = MAP[tIdx(tx, ty - 1)] === TW;   // in a vertical wall: passage runs east-west
  g.fillStyle = '#0a0809'; g.fillRect(x, y, T, T);
  g.fillStyle = '#1a1719'; if (vertWall) g.fillRect(x, y + 3, T, 10); else g.fillRect(x + 3, y, 10, T);
  g.fillStyle = '#7a7470';
  if (vertWall) { g.fillRect(x, y + 2, 2, 12); g.fillRect(x + T - 2, y + 2, 2, 12); }
  else { g.fillRect(x + 2, y, 12, 2); g.fillRect(x + 2, y + T - 2, 12, 2); }
  g.fillStyle = '#3a3634';
  for (let k = 0; k < 5; k++) { if (vertWall) { g.fillRect(x + 0.3, y + 3.5 + k * 2.2, 1.4, 1); g.fillRect(x + T - 1.7, y + 3.5 + k * 2.2, 1.4, 1); } else { g.fillRect(x + 3.5 + k * 2.2, y + 0.3, 1, 1.4); g.fillRect(x + 3.5 + k * 2.2, y + T - 1.7, 1, 1.4); } }
}

// ---------- the whole house, baked into one canvas ----------
function buildWorld() {
  const c = mk(WW, WH), g = c.getContext('2d');
  g.fillStyle = '#060507'; g.fillRect(0, 0, WW, WH);
  ROOMS.forEach((r, i) => drawFloor(g, r, 100 + i * 37));
  // thresholds in doorways
  for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
    const i = tIdx(tx, ty);
    if (MAP[i] === TF && ROOMOF[i] < 0) { srand(i); planks(g, tx * T, ty * T, T, T, 4, ['#3a2416', '#33200f', '#402a19'], i); }
  }
  // creaky boards: a little lighter and split
  for (let i = 0; i < MW * MH; i++) if (CREAK[i]) {

// ---- the blink (solo): the dog fades out where it stands and steps out of the dark behind you ----

    dog.blinkSpot = s; dog.x = s[0]; dog.y = s[1]; dog.alpha = 0;
    dog.ang = Math.atan2(cat.y - dog.y, cat.x - dog.x);
    dog.lastX = cat.x; dog.lastY = cat.y; dog.repath = 0; dog.pounceCD = Math.max(dog.pounceCD, 1.1);   // no instant pounce
    G.shake = Math.max(G.shake, 0.45); G.flash = Math.max(G.flash, 0.12);
    Sound.creak(0.25, panOf(dog.x)); Sound.snarl(0.7, panOf(dog.x)); buzz([30, 30, 60]);
    for (let k = 0; k < 14; k++) emit(dog.x, dog.y, rand(-60, 60), rand(-60, 60), rand(0.4, 0.9), k % 3 ? '#0a0810' : '#2a1a2a', rand(1.5, 3), 3);

  dog.pounceCD = G.twoP ? CONFIG.dogPlayer.pounceCooldown : CONFIG.dog.pounceCooldown;

}

  if (moveEnt(dog, dog.vx * dt, dog.vy * dt, D.half, false)) { dog.t = D.pounceTime; Sound.thud(0.4, panOf(dog.x)); G.shake = Math.max(G.shake, 0.3); }

// ---- the dog: second player (arrows, Right Shift charge, / or Enter pounce) ----
function dogPlayer(dt) {
  const P = CONFIG.dogPlayer;
  dog.pounceCD -= dt;
  if (dog.state === 'windup') {
    dog.t += dt; dog.vx *= 0.7; dog.vy *= 0.7; dogMove(dt);
    if (dog.t >= P.pounceWindup) startPounce(dog.ang);
    return;
  }
  if (dog.state === 'pounce') { updatePounce(dt); return; }
  if (dog.state === 'recover') { dog.t += dt; dog.vx *= 0.85; dog.vy *= 0.85; dogMove(dt); if (dog.t >= CONFIG.dog.recover) dog.state = 'hunt'; return; }

  else { dog.stam = Math.min(1, dog.stam + P.regen * dt); if (dog.exhausted && dog.stam > 0.35) dog.exhausted = false; }

function updateDog(dt) {
  if (G.twoP && G.state === 'play') dogPlayer(dt); else dogAI(dt);

      (dog.state === 'hunt' || dog.state === 'search' || dog.state === 'wander' || dog.state === 'pounce' || dog.state === 'windup') &&
      dist(dog, cat) < CONFIG.dog.catchDist + (dog.state === 'pounce' ? 4 : 0)) startLunge();

// ---- jump scares (solo): the dog goes quiet and waits inside a wardrobe ----
function pickLurk() {
  const S = CONFIG.scare; let best = null, bd = 1e9;

  q.len = G.qteCount === 0 ? Q.keysEasy : (G.diff > 0.45 || G.qteCount >= 2 ? Q.keysHard : randi(Q.keysEasy, Q.keysHard));
  for (let i = 0; i < q.len; i++) { let k; do { k = randi(0, 3); } while (i > 0 && k === q.keys[i - 1]); q.keys[i] = k; }
  for (let i = 0; i < q.len; i++) { let k; do { k = randi(0, 3); } while (i > 0 && k === q.dkeys[i - 1]); q.dkeys[i] = k; }

function updateQTE(rawDt) {

// ---- atmosphere: danger, heartbeat, growl, storm, ghosts, the clock ----
function updateAtmos(dt, inPlay) {
  // lightning and thunder
  G.lightT -= dt;
  if (G.lightT <= 0) {
    G.lightT = rand(CONFIG.lightning.min, CONFIG.lightning.max);
    G.lightning = 1; G.thunderT = rand(0.25, 1.4); G.lightDouble = Math.random() < 0.6 ? 0.18 : -1;
  }
  if (G.lightDouble > 0) { G.lightDouble -= dt; if (G.lightDouble <= 0) G.lightning = 0.8; }
  G.lightning = Math.max(0, G.lightning - dt * 4.5);
  if (G.thunderT > 0) { G.thunderT -= dt; if (G.thunderT <= 0) Sound.thunder(rand(0.4, 0.75)); }
  G.flash = Math.max(0, G.flash - dt * 2.2);
  G.shake = Math.max(0, G.shake - dt * 1.8);
  if (!inPlay) return;
  // danger drives the heartbeat, the red edges and the growl
  const d = dist(dog, cat);
  const aware = dog.state === 'hunt' || dog.state === 'windup' || dog.state === 'pounce' || dog.state === 'lunge' || dog.state === 'burst';
  let target = 0;
  if (dog.state === 'lurk') target = 0.05;
  else if (dog.state === 'blink') target = 0.55;                       // the silence before it steps out behind you
  else if (dog.state !== 'retreat') target = clamp(1 - d / 260, 0, 1) * (aware ? 1 : dog.state === 'search' ? 0.7 : 0.45);
  if (G.qte.active) target = 1;
  G.danger += (target - G.danger) * Math.min(1, dt * 3);
  const gone = dog.state === 'lurk' || dog.state === 'retreat' || (dog.state === 'blink' && dog.alpha < 0.3);
  Sound.setGrowl(gone ? 0 : clamp(G.danger * 1.2 - 0.1, 0, 1) * (G.twoP ? 0.7 : 1), panOf(dog.x));
  G.heartT -= dt;
  if (G.heartT <= 0) { G.heartT = 1 / lerp(1.0, 2.7, G.danger); G.heartPulse = 1; Sound.heart(lerp(0.12, 0.5, G.danger)); }
  G.heartPulse = Math.max(0, G.heartPulse - dt * 4);
  // the grandfather clock strikes the hour
  const hour = 3 + Math.floor(clockMins(G.t) / 60);
  if (hour > G.chimed && hour < 6) { G.chimed = hour; Sound.bong(hour); G.roomLabel = hour + ':00 AM'; G.roomLabelT = 2.6; }
  if (cat.room === 4 && G.frame % 60 === 0) { const cd = Math.hypot(cat.x - 27.5 * T, cat.y - 16.5 * T); if (cd < 160) Sound.tick(0.06 * (1 - cd / 160), panOf(27.5 * T)); }
  // a pale girl, glimpsed at the edge of your sight
  const gh = G.ghost;
  if (gh.active) { gh.t += dt; if (gh.t > 0.9) gh.active = false; }
  else {
    gh.next -= dt;
    if (gh.next <= 0) {
      gh.next = rand(CONFIG.ghost.min, CONFIG.ghost.max);
      for (let k = 0; k < 12; k++) {
        const a = rand(0, TAU), r = rayDist(cat.x, cat.y, Math.cos(a), Math.sin(a), 170);
        if (r > 100) { gh.x = cat.x + Math.cos(a) * r * 0.8; gh.y = cat.y + Math.sin(a) * r * 0.8; gh.active = true; gh.t = 0; Sound.whisper(panOf(gh.x)); break; }
      }
    }
  }
  // ambient: slams, creaks, distant whispers
  G.ambT -= dt;
  if (G.ambT <= 0) {
    G.ambT = rand(7, 15); const r = Math.random(), p = rand(-1, 1);
    if (r < 0.3) Sound.slam(p); else if (r < 0.65) Sound.creak(0.1, p); else if (r < 0.8) Sound.whisper(p); else Sound.gust();
  }
}
function updateParticles(dt) {
  for (let i = 0; i < PARTS.length; i++) {
    const p = PARTS[i]; if (!p.active) continue;
    p.life -= dt; if (p.life <= 0) { p.active = false; continue; }
    const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = 0; i < RIPPLES.length; i++) {
    const p = RIPPLES[i]; if (!p.active) continue;
    p.t += dt; p.r = p.max * Math.min(1, p.t / 0.55); if (p.t > 0.75) p.active = false;
  }
  for (let i = 0; i < POPS.length; i++) { const p = POPS[i]; if (!p.active) continue; p.t += dt; p.y -= 12 * dt; if (p.t > 1.1) p.active = false; }
}
function updateCameras(dt, snap) {
  const k = snap ? 1 : Math.min(1, dt * 6);
  const vw = G.twoP && G.state !== 'title' ? W / 2 : W;
  const tgt = [cat, dog];
  for (let i = 0; i < 2; i++) {
    const c = G.cams[i], e = tgt[i];
    c.x = lerp(c.x, clamp(e.x - vw / 2, -8, WW - vw + 8), k);
    c.y = lerp(c.y, clamp(e.y - H / 2, -8, WH - H + 8), k);

}
function updateClock() {
  const m = clockMins(G.t);
  if (m !== G.clockMin) { G.clockMin = m; G.clockStr = fmtClock(G.t); }
}

// ==========================================================================
// 11. RENDERING
//    Each view: the baked house, props and characters, then a darkness layer

//    baked lightmap and the viewer's own eyes), then additive glows.

const darkC = mk(W, H), dg = darkC.getContext('2d');

function drawCatSprite() {

  let a = 1;

  if (cat.inv > 0 && cat.state === 'free' && (G.frame & 4)) a *= 0.45;
  const moving = cat.speed > 4 && cat.state === 'free';
  const fr = SPR.cat[moving ? Math.floor(cat.anim * 8) % 8 : 0];
  ctx.globalAlpha = a * 0.8; ctx.drawImage(SPR.shadow, cat.x - 11, cat.y - 6, 24, 15);
  ctx.globalAlpha = a;
  ctx.save(); ctx.translate(cat.x, cat.y); ctx.rotate(cat.ang);
  if (cat.dashT > 0) ctx.scale(1.18, 0.9);
  if (cat.state === 'qte') ctx.rotate(Math.sin(G.time * 40) * 0.25);
  ctx.drawImage(fr, -15, -9, 30, 18);
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawDogSprite() {
  if (dog.alpha <= 0.01) return;
  ctx.globalAlpha = dog.alpha * 0.8; ctx.drawImage(SPR.shadow, dog.x - 26, dog.y - 13, 55, 32);
  ctx.globalAlpha = dog.alpha;
  const moving = dog.speed > 4;
  let fr = SPR.dog[moving ? Math.floor(dog.anim * 8) % 8 : 0];
  ctx.save(); ctx.translate(dog.x, dog.y);

    ctx.fillStyle = '#f3c64f';
    for (let k = 0; k < 3; k++) { const a = G.time * 5 + k * TAU / 3; ctx.fillRect(dog.x + Math.cos(a) * 9 - 0.8, dog.y - 12 + Math.sin(a) * 3 - 0.8, 1.6, 1.6); }

function renderView(vx, vw, px, py, cam, mode) {

  ctx.save();

  ctx.beginPath(); ctx.rect(vx, 0, vw, H); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(vx, 0, vw, H);
  ctx.setTransform(RES, 0, 0, RES, (vx - camX) * RES, -camY * RES);
  // the house
  const sx = Math.max(0, camX), sy = Math.max(0, camY), sw = Math.min(WW, camX + vw) - sx, sh = Math.min(WH, camY + H) - sy;
  ctx.drawImage(SPR.world, sx * RES, sy * RES, sw * RES, sh * RES, sx, sy, sw, sh);
  const inView = (x, y, m) => x > camX - m && x < camX + vw + m && y > camY - m && y < camY + H + m;

    else ctx.drawImage(SPR.vase, v.x - 6, v.y - 6, 12, 12);

  for (let i = 0; i < PARTS.length; i++) {
    const p = PARTS[i]; if (!p.active || !inView(p.x, p.y, 4)) continue;
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }

  const playing = mode !== 2;
  let dogVis = false, catVis = false;
  if (playing) {
    if (mode === 1) { dogVis = true; catVis = cat.visible && losClear(px, py, cat.x, cat.y) && (!cat.hidden || dist(cat, dog) < CONFIG.dog.smell) && dist(cat, dog) < R; }
    else { catVis = true; dogVis = dog.alpha > 0.01 && dog.state !== 'lurk' && dist(cat, dog) < R && losClear(px, py, dog.x, dog.y); }

  dg.fillStyle = '#000'; dg.fillRect(camX, camY, vw, H);

    if (mode === 1) {             // the dog's nose: a glowing scent trail

}

      text('SHIFT SPRINT  ·  SPACE DASH  ·  HIDE UNDER BEDS AND TABLES  ·  ONLY YOU FIT THROUGH VENTS', W / 2, H - 14, 'g', 1, 1);
    } else {
      text('WASD  ·  L-SHIFT SPRINT  ·  SPACE DASH', W / 4, H - 14, 'g', 1, 1);
      text('ARROWS  ·  R-SHIFT CHARGE  ·  / POUNCE', W * 0.75, H - 14, 'g', 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}

function qteRow(keys, idx, set, cxm, y, size) {
  const q = G.qte, gapx = size * 0.3, total = q.len * size + (q.len - 1) * gapx;
  let x = cxm - total / 2;
  for (let i = 0; i < q.len; i++) {
    const cur = i === idx, done = i < idx;
    if (done) ctx.globalAlpha = 0.3;
    const key = set[keys[i]][cur ? 1 : 0];
    const pop = cur && (G.time * 8 % 1) < 0.5 ? 2 : 0;
    ctx.drawImage(key, x - pop, y - pop, size + pop * 2, size * 1.07 + pop * 2);
    ctx.globalAlpha = 1;
    x += size + gapx;
  }
}
function drawQTE() {
  const q = G.qte;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 70, W, 84);
  const jx = (G.frame & 2) ? 1 : -1;
  textS('STRUGGLE!', W / 2 + jx, 78, 'r', 2, 1);
  if (!G.twoP) qteRow(q.keys, q.idx, SPR.keys, W / 2, 100, 28);
  else {
    text('CAT', W / 2 - 120, 96, 'b', 1, 1); qteRow(q.keys, q.idx, SPR.keysW, W / 2 - 120, 106, 22);
    text('DOG', W / 2 + 120, 96, 'r', 1, 1); qteRow(q.dkeys, q.didx, SPR.keys, W / 2 + 120, 106, 22);
    text('FIRST TO FINISH WINS', W / 2, 112, 'g', 1, 1);
  }
  const frac = clamp(q.timer / q.total, 0, 1);
  ctx.fillStyle = '#000'; ctx.fillRect(W / 2 - 81, 139, 162, 6);
  ctx.fillStyle = frac < 0.35 ? ((G.frame & 4) ? '#ff3a3a' : '#a01f25') : '#e0393a';
  ctx.fillRect(W / 2 - 80, 140, 160 * frac, 4);
  if (TouchUI.on) text('TAP THE ARROW PAD  ·  OR SWIPE ANYWHERE', W / 2, 146, 'w', 1, 1);
}

const CONTROLS_SOLO = [
  ['ARROWS / WASD', 'MOVE'], ['SHIFT', 'SPRINT'], ['SPACE', 'DASH'], ['UNDER FURNITURE', 'HIDE'], ['VENTS', 'CAT-ONLY SHORTCUTS'],
  ['VASES', 'SMASH NEAR THE DOG'], ['P / ESC', 'PAUSE'], ['M', 'MUTE'], ['F', 'FPS'], ['R', 'RESTART'],
];
const CONTROLS_DUO = [
  ['WASD', 'CAT: MOVE'], ['LEFT SHIFT', 'CAT: SPRINT'], ['SPACE', 'CAT: DASH'], ['FURNITURE, VENTS', 'CAT: HIDE'], ['P  M  F  R', 'PAUSE MUTE FPS RESTART'],
  ['ARROWS', 'DOG: MOVE'], ['RIGHT SHIFT', 'DOG: CHARGE'], ['/ OR ENTER', 'DOG: POUNCE'], ['GREEN TRAIL', 'DOG: SCENT'], ['RINGS', 'DOG: NOISE HEARD'],
];
const CONTROLS_TOUCH = [
  ['LEFT THUMB', 'MOVE (DRAG ANYWHERE)'], ['SPRINT', 'HOLD TO RUN'], ['DASH', 'TAP TO DASH'], ['ARROW PAD', 'TAP TO STRUGGLE FREE'], ['UNDER FURNITURE', 'HIDE'],
  ['VENTS', 'CAT-ONLY SHORTCUTS'], ['VASES', 'SMASH NEAR THE DOG'], ['RUNNING', 'IS LOUD. WALK WHEN IT IS NEAR'], ['PAUSE BUTTON', 'MENU, SOUND, FULLSCREEN'], ['HEADPHONES', 'HEAR WHICH SIDE IT IS ON'],
];
function drawControls(y, duo) {
  const list = TouchUI.on ? CONTROLS_TOUCH : duo ? CONTROLS_DUO : CONTROLS_SOLO;
  for (let i = 0; i < list.length; i++) {
    const col = i < 5 ? 0 : 1, row = col === 0 ? i : i - 5;
    const x = col === 0 ? 46 : 256, yy = y + row * 10;
    text(list[i][0], x, yy, 'g', 1, 0); text(list[i][1], x + 82, yy, 'w', 1, 0);
  }
}

function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.fillRect(0, 0, W, H);
  const glitch = Math.random() < 0.04 ? randi(-3, 3) : 0;
  textS('NINE LIVES', W / 2 + glitch, 34, 'r', 5, 1);
  text('THE HOUSE AT 3:00 AM  ·  SURVIVE UNTIL DAWN', W / 2, 80, 'g', 1, 1);
  if (!TouchUI.on) {          // on a phone the PLAY button sits here instead
    const opts = ['SOLO  -  YOU ARE THE CAT. THE HOUSE IS NOT EMPTY.', 'TWO PLAYERS  -  CAT (WASD) VS DOG (ARROWS), SPLIT SCREEN'];
    for (let i = 0; i < 2; i++) {
      const sel = G.menuSel === i, y = 100 + i * 15;
      if (sel) { ctx.fillStyle = 'rgba(224,57,58,0.18)'; ctx.fillRect(W / 2 - 170, y - 3, 340, 13); }
      textS((sel ? '>  ' : '') + (i + 1) + '.  ' + opts[i] + (sel ? '  <' : ''), W / 2, y, sel ? 'y' : 'g', 1, 1);
    }
    const flick = (G.time % 1.1) < 0.75 && Math.random() > 0.04;
    if (flick) text('↑ ↓ TO CHOOSE   ·   ENTER OR SPACE TO START', W / 2, 133, 'w', 1, 1);
  }
  drawControls(TouchUI.on ? 160 : 152, G.menuSel === 1);
  if (G.best > 0) text('SOLO BEST: ' + G.bestStr, W / 2, 214, 'y', 1, 1);
  if (!Sound.running() && (G.time % 1.1) < 0.8) textS(TouchUI.on ? 'TAP ANYWHERE TO TURN ON SOUND' : 'PRESS ANY KEY TO TURN ON SOUND', W / 2, 236, 'y', 1, 1);
  text('USE HEADPHONES. LISTEN FOR WHICH SIDE IT IS ON.', W / 2, 250, 'g', 1, 1);
}

function drawIntroText() {
  const T0 = G.introT;
  if (T0 < 3.3) {
    ctx.globalAlpha = clamp((T0 - 0.2) * 2, 0, 1) * clamp((3.3 - T0) * 3, 0, 1);
    textS('3:00 AM', W / 2, 52, 'w', 4, 1);
    if (T0 > 1.4) {
      ctx.globalAlpha *= clamp((T0 - 1.4) * 2, 0, 1);
      textS('SOMETHING IS LOOSE IN THE HOUSE', W / 2, 96, 'r', 2, 1);
      if (G.twoP) text('CAT: WASD  ·  DOG: ARROWS', W / 2, 120, 'g', 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}
function drawRunText() {
  const t = G.runTextT;
  const scale = Math.max(8, 16 - Math.floor(t * 50));
  if (t > 0.9 && (G.frame & 2)) return;
  const jx = t < 0.3 ? randi(-2, 2) : 0;
  textS('RUN', W / 2 + jx, H / 2 - 3.5 * scale - 20, 'r', scale, 1);
}

function drawEnd() {
  if (G.state === 'caught') {
    if (!G.endShown) return;
    textS('CAUGHT', W / 2 + ((G.frame & 4) && G.endT < 1.6 ? 1 : 0), 62, 'r', 6, 1);
    if (G.twoP) textS('THE DOG WINS', W / 2, 112, 'r', 2, 1);
    text((G.twoP ? 'THE CAT SURVIVED ' : 'YOU SURVIVED ') + G.survivedStr, W / 2, 134, 'w', 1, 1);
    text('THE CLOCK READ ' + G.endClockStr, W / 2, 147, 'g', 1, 1);
    if (!G.twoP) text((G.newBest ? 'NEW BEST: ' : 'BEST: ') + G.bestStr, W / 2, 160, 'y', 1, 1);
    if (TouchUI.on) return;                                     // the buttons are real on a phone
    if ((G.time % 1) < 0.7) textS('PRESS R TO TRY AGAIN', W / 2, 186, 'w', 2, 1);
    text('ESC FOR MENU', W / 2, 210, 'g', 1, 1);
  } else if (G.state === 'win' && G.endShown) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 50, W, 130);
    textS('SURVIVED', W / 2, 62, 'y', 6, 1);
    text('6:00 AM. LIGHT CREEPS THROUGH THE WINDOWS.', W / 2, 124, 'w', 1, 1);
    if (G.twoP) textS('THE CAT WINS', W / 2, 136, 'b', 1, 1);
    else {
      text('TIME SURVIVED ' + G.survivedStr, W / 2, 138, 'w', 1, 1);
      text((G.newBest ? 'NEW BEST: ' : 'BEST: ') + G.bestStr, W / 2, 152, 'y', 1, 1);
    }
    if (!TouchUI.on && (G.time % 1) < 0.7) textS('PRESS R TO PLAY AGAIN   ·   ESC FOR MENU', W / 2, 166, 'w', 1, 1);
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
  textS('PAUSED', W / 2, 50, 'w', 4, 1);
  if (TouchUI.on) { drawControls(192, false); return; }     // the buttons sit between the title and the list
  drawControls(110, G.twoP);
  text('P / ESC TO RESUME', W / 2, 190, 'y', 1, 1);
}

let fpsStr = '', fpsFrames = 0, fpsTime = 0;
function render() {
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (G.state === 'caught' && G.blackout) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  else if (G.state === 'title') renderView(0, W, G.titleV.x, G.titleV.y, G.cams[0], 2);
  else if (G.twoP) {
    renderView(0, W / 2, cat.x, cat.y, G.cams[0], 0);
    renderView(W / 2, W / 2, dog.x, dog.y, G.cams[1], 1);
    ctx.fillStyle = '#000'; ctx.fillRect(W / 2 - 1, 0, 2, H);
    ctx.fillStyle = 'rgba(160,30,30,0.5)'; ctx.fillRect(W / 2 - 0.25, 0, 0.5, H);
  } else renderView(0, W, cat.x, cat.y, G.cams[0], 0);
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if (G.lightning > 0) { ctx.globalAlpha = G.lightning * 0.1; ctx.fillStyle = '#dfe6ff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // film grain
  ctx.save(); ctx.setTransform(1, 0, 0, 1, -randi(0, 127), -randi(0, 127));
  ctx.fillStyle = SPR.grain; ctx.fillRect(0, 0, canvas.width + 128, canvas.height + 128); ctx.restore();
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if (G.state === 'play') {
    drawHUD();
    if (G.qte.active) drawQTE();
    if (G.runTextT >= 0 && G.runTextT < 1.2) drawRunText();
  } else if (G.state === 'intro') {
    drawIntroText();
    if (G.runTextT >= 0) drawRunText();
  } else if (G.state === 'title') drawTitle();
  else if (G.state === 'win') drawHUD();
  drawEnd();
  if (G.flash > 0) { ctx.globalAlpha = Math.min(1, G.flash); ctx.fillStyle = '#e8e8ff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.fade > 0) { ctx.globalAlpha = Math.min(1, G.fade); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.paused) drawPause();
  if (G.muted) text('MUTED', W - 6, H - 11, 'g', 1, 2);
  if (G.showFps) textS(fpsStr, 6, H - 11, 'y', 1, 0);
}

// ==========================================================================
// 12. GAME STATES
// ==========================================================================
function setPaused(p) {
  if (p === G.paused) return;
  G.paused = p;
  if (p) Sound.suspend(); else Sound.resume();
}

function resetWorld() {
  resetCat(); resetDog();
  VASES.forEach(v => { v.broken = false; });
  SCENT.forEach(s => { s.t = -99; s.ok = false; }); scentHead = 0;
  PARTS.forEach(p => { p.active = false; }); RIPPLES.forEach(p => { p.active = false; }); POPS.forEach(p => { p.active = false; });
}
function newRun(quick) {
  resetWorld();
  G.state = 'intro'; G.paused = false; Sound.resume();
  G.t = 0; G.diff = 0; G.dawn = 0; G.qteCount = 0; G.clockMin = -1; updateClock(); G.chimed = 3;
  G.introT = quick ? 2.6 : 0; G.introT0 = G.introT; G.fade = 1; G.blackout = false; G.endShown = false; G.newBest = false;
  G.shake = 0; G.flash = 0; G.danger = 0; G.heartT = 0; G.runTextT = -1; G.qte.active = false; G.endT = 0;
  G.scare.idx = 0; G.scare.phase = 0; G.ghost.active = false; G.ghost.next = rand(22, 36); G.ambT = rand(5, 9);
  G.nurseryDone = false; G.roomLabelT = 0; G.hintT = 0; G.lightT = quick ? 6 : 0.7; G.blinkCD = CONFIG.blink.grace;
  updateCameras(0, true);
  Sound.setGrowl(0);
}
function startPlay() {
  G.state = 'play'; G.t = 0; G.hintT = 9; cat.room = -1;
  if (G.twoP) dog.state = 'hunt';
  else { toSearch(cat.x + rand(-90, 90), cat.y + rand(0, 80)); dog.scentT = 0; }
}
function startCaught() {
  G.state = 'caught'; G.endT = 0; G.blackout = false; G.endShown = false;
  cat.state = 'caught'; dog.state = 'lunge'; dog.alpha = 1;
  Sound.snarl(0.8); saveBest(); buzz([60, 40, 220]);
}
function toTitle() {
  resetWorld(); G.state = 'title'; G.fade = 1; G.qte.active = false; Sound.setGrowl(0);
  if (G.paused) setPaused(false);
}
function startWin() {
  G.state = 'win'; G.endT = 0; G.endShown = false;
  saveBest();
  dog.state = 'retreat'; dog.repath = 0; Sound.whimper(); Sound.setGrowl(0); Sound.birds();
}

function updateTitle(dt) {
  G.titleV.x = 37.5 * T + Math.sin(G.time * 0.11) * 150;
  G.titleV.y = 24 * T + Math.sin(G.time * 0.17) * 80;
  const c = G.cams[0]; c.x = G.titleV.x - W / 2; c.y = G.titleV.y - H / 2;
  G.dawn = 0; G.danger = 0;
  updateAtmos(dt, false); updateParticles(dt);
  G.fade = Math.max(0, G.fade - dt);
  if (Input.hit[A.UP] || Input.hit[A.DOWN] || Input.hit[A.LEFT] || Input.hit[A.RIGHT]) { G.menuSel = 1 - G.menuSel; Sound.click(0.2); }
  if (Input.hit[A.ONE]) { G.menuSel = 0; G.twoP = false; newRun(false); }
  else if (Input.hit[A.TWO]) { G.menuSel = 1; G.twoP = true; newRun(false); }
  else if (Input.hit[A.CONFIRM] || Input.hit[A.DASH]) { G.twoP = G.menuSel === 1; newRun(false); }
}
function updateIntro(dt) {
  const prev = G.introT; G.introT += dt; const t = G.introT;
  const crossed = a => prev < a && t >= a;
  if (t > G.introT0 + 0.6 && t < 3.25 && (Input.hit[A.CONFIRM] || Input.hit[A.DASH])) G.introT = 3.25;
  G.fade = Math.max(0, 1 - (t - G.introT0) / 0.8);
  if (crossed(0.7)) { G.lightning = 1; Sound.thunder(0.7); }
  if (crossed(1.6)) Sound.howl(panOf(dog.x));
  if (crossed(2.7)) Sound.snarl(0.35, panOf(dog.x));
  if (crossed(3.3)) { G.runTextT = 0; Sound.hiss(0.4); Sound.bark(0.7, true, panOf(dog.x)); G.shake = 0.6; G.flash = 0.2; }
  if (G.runTextT >= 0) G.runTextT += dt;
  updateAtmos(dt, false); updateParticles(dt); updateCameras(dt);
  if (G.introT >= 4.4) startPlay();
}
function updatePlay(rawDt) {
  let ts = 1;
  if (G.qte.active) ts = CONFIG.qte.slowmo;
  else if (G.scare.phase === 2) ts = CONFIG.scare.slowmo;
  const dt = rawDt * ts;
  G.t += dt; G.diff = clamp(G.t / CONFIG.runLength, 0, 1);
  G.dawn = smooth(CONFIG.dawnStart, CONFIG.runLength + 4, G.t);
  if (G.runTextT >= 0) G.runTextT += rawDt;
  G.hintT -= rawDt; G.roomLabelT -= rawDt;
  if (G.qte.active) updateQTE(rawDt);
  if (G.state !== 'play') return;           // the struggle was lost this step
  updateCat(dt);
  updateDog(dt);
  updateScare(dt, rawDt);
  updateParticles(dt);
  updateCameras(rawDt);
  updateAtmos(rawDt, true);
  updateClock();
  if (G.t >= CONFIG.runLength && !G.qte.active && cat.state === 'free' && G.scare.phase !== 2) startWin();
}
function updateCaught(dt) {
  G.endT += dt;
  if (!G.blackout) {
    dog.x = lerp(dog.x, cat.x, Math.min(1, dt * 10)); dog.y = lerp(dog.y, cat.y, Math.min(1, dt * 10));
    G.shake = Math.max(G.shake, 0.8);
    if (G.endT >= 0.35) { G.blackout = true; Sound.bark(1, false); Sound.thud(1); Sound.setGrowl(0); }
  }
  if (G.endT >= 1.1 && !G.endShown) G.endShown = true;
  G.shake = Math.max(0, G.shake - dt * 1.8);
  G.danger = Math.max(0, G.danger - dt);
  updateParticles(dt);
}
function updateWin(dt) {
  G.endT += dt;
  G.t += dt; G.dawn = smooth(CONFIG.dawnStart, CONFIG.runLength + 4, G.t);
  cat.vx *= 0.9; cat.vy *= 0.9; cat.speed = 0;
  updateDog(dt);
  if (G.endT > 1.6 && !G.endShown) { G.endShown = true; Sound.chord(); }
  updateParticles(dt); updateCameras(dt); updateAtmos(dt, false);
  G.danger = Math.max(0, G.danger - dt);
}
function update(dt) {
  G.time += dt; G.frame++;
  setControlMaps();
  switch (G.state) {
    case 'title': updateTitle(dt); break;
    case 'intro': updateIntro(dt); break;
    case 'play': updatePlay(dt); break;
    case 'caught': updateCaught(dt); break;
    case 'win': updateWin(dt); break;
  }
}
// keys that work in every state (handled once per rendered frame)
function handleMeta() {
  if (Input.hit[A.MUTE]) { G.muted = !G.muted; Sound.setMuted(G.muted); }
  if (Input.hit[A.FPS]) G.showFps = !G.showFps;
  if (Input.hit[A.PAUSE]) {
    Input.hit[A.PAUSE] = 0;
    if (G.state === 'play' || G.state === 'intro') setPaused(!G.paused);
    else if ((G.state === 'caught' || G.state === 'win') && G.endShown) toTitle();
  }
  if (Input.hit[A.RESTART] && G.state !== 'title') { Input.hit[A.RESTART] = 0; G.paused = false; newRun(true); }
  if (G.paused) Input.clearHits();
}

// ==========================================================================
// 13. MAIN LOOP — fixed 60 Hz update, dt capped at 50 ms. The frame is only
//     redrawn when the simulation moved (120 Hz phones would otherwise paint
//     every frame twice for nothing).
// ==========================================================================
const STEP = 1 / 60;
let lastTime = performance.now(), acc = 0, redraw = true;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastTime) / 1000; lastTime = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  handleMeta();
  if (!G.paused) {
    acc += dt;
    while (acc >= STEP) { update(STEP); Input.clearHits(); acc -= STEP; redraw = true; }
  } else { acc = 0; redraw = true; }
  if (Input.hit[A.MUTE] || Input.hit[A.FPS]) { Input.hit[A.MUTE] = 0; Input.hit[A.FPS] = 0; }
  fpsTime += dt;
  if (fpsTime >= 0.5) { fpsStr = Math.round(fpsFrames / fpsTime) + ' FPS'; fpsFrames = 0; fpsTime = 0; }
  if (redraw) { redraw = false; fpsFrames++; render(); }
  TouchUI.sync();
}

buildAll();
resetWorld();
G.state = 'title'; G.fade = 1;
touchReady = true;
TouchUI.set(TouchUI.initial);
window.__NL = { G, cat, dog, CONFIG, VASES, MAP, startLunge, startWin, breakVase, Input, TouchUI };   // handy for tinkering in the console
requestAnimationFrame(frame);
</script>
